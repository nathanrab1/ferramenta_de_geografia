<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramenta de Regionalização - CLIC Geografia</title>

    <!-- CSS -->
    <!-- ?v= forca o navegador a baixar o CSS de novo quando ele muda -->
    <link rel="stylesheet" href="src/styles/colors.css?v=6">
    <link rel="stylesheet" href="src/styles/main.css?v=6">

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Blockly -->
    <script src="https://unpkg.com/blockly@10/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/msg/pt-br.js"></script>
</head>
<body>
    <div id="app">
        <dados-panel v-if="!loading" :paises="paises" :style="{ width: panelWidths[0] + 'px' }"></dados-panel>
        <div v-if="!loading" class="resizer" @mousedown="startResize(0, $event)"></div>
        <blockly-panel v-if="!loading" :paises="paises" :style="{ width: panelWidths[1] + 'px' }"></blockly-panel>
        <div v-if="!loading" class="resizer" @mousedown="startResize(1, $event)"></div>
        <mapa-panel v-if="!loading" :paises="paises" :paises-iso-mapping="paisesISOMapping"></mapa-panel>
        <div v-if="loading" style="padding: 20px; text-align: center;">
            <h2>⏳ Carregando...</h2>
        </div>
    </div>

    <!-- Componentes e App -->
    <script type="module">
        import BlocklyPanel from './src/components/BlocklyPanel.js';

        const { createApp } = Vue;

        // Componente: DadosPanel
        const DadosPanel = {
            name: 'DadosPanel',
            props: ['paises'],
            data() {
                return {
                    colunaSelecionada: 'regiao'
                };
            },
            template: `
                <div class="panel dados-panel">
                    <div class="coluna-seletor">
                        <label for="coluna-select">Visualizar coluna:</label>
                        <select id="coluna-select" v-model="colunaSelecionada">
                            <option value="regiao">Região</option>
                            <option value="idioma">Idioma</option>
                            <option value="esporte">Esporte</option>
                            <option value="idh">IDH</option>
                            <option value="populacao">População</option>
                        </select>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="dados-table">
                            <thead>
                                <tr>
                                    <th>País</th>
                                    <th v-if="colunaSelecionada === 'regiao'">Região</th>
                                    <th v-if="colunaSelecionada === 'idioma'">Idioma</th>
                                    <th v-if="colunaSelecionada === 'esporte'">Esporte</th>
                                    <th v-if="colunaSelecionada === 'idh'">IDH</th>
                                    <th v-if="colunaSelecionada === 'populacao'">População</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="pais in paises" :key="pais['País']">
                                    <td><strong>{{ pais['País'] }}</strong></td>
                                    <td v-if="colunaSelecionada === 'regiao'">{{ pais['Região'] }}</td>
                                    <td v-if="colunaSelecionada === 'idioma'">{{ pais['Idioma principal'] }}</td>
                                    <td v-if="colunaSelecionada === 'esporte'">{{ pais['Esporte mais popular'] }}</td>
                                    <td v-if="colunaSelecionada === 'idh'">{{ formatarIDH(pais['IDH']) }}</td>
                                    <td v-if="colunaSelecionada === 'populacao'">{{ formatarNumero(pais['População']) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            methods: {
                formatarIDH(idh) {
                    return idh ? idh.toFixed(3) : '0.000';
                },
                formatarNumero(num) {
                    return num ? num.toLocaleString('pt-BR') : '0';
                }
            }
        };

        // Cinza original dos paises no america_map.svg (fill:#787878)
        const COR_PADRAO_PAIS = '#787878';

        // Componente: MapaPanel
        const MapaPanel = {
            name: 'MapaPanel',
            props: ['paises', 'paisesIsoMapping'],
            data() {
                return {
                    svgContent: '',
                    // Controles de zoom e pan
                    scale: 1,
                    translateX: 0,
                    translateY: 0,
                    isPanning: false,
                    startPanX: 0,
                    startPanY: 0,
                    // Velocidade da pintura (1 = lento ... 10 = rápido)
                    velocidade: 9,
                    // Itens {cor, nomeCor, rotulo, detalhe} montados pelo
                    // BlocklyPanel a partir dos blocos, ao executar
                    legenda: [],
                    // Colunas usadas nos blocos "se" da última execução;
                    // aparecem no tooltip de cada país
                    colunasVisualizadas: [],
                    // Tooltip do país sob o mouse: { nome, atributos: [{rotulo, valor}], x, y }
                    tooltip: null
                };
            },
            computed: {
                // Código ISO (id no SVG) -> registro do país, para o tooltip
                paisPorISO() {
                    const porNome = Object.fromEntries((this.paises || []).map(p => [p['País'], p]));
                    const mapa = {};
                    for (const [nome, iso] of Object.entries(this.paisesIsoMapping || {})) {
                        mapa[iso] = porNome[nome] || { 'País': nome };
                    }
                    return mapa;
                },
                // Pausa entre países em ms: 1000ms (lento) ... 100ms (rápido)
                intervaloMs() {
                    return (11 - this.velocidade) * 100;
                }
            },
            template: `
                <div class="panel mapa-panel">
                    <div class="mapa-area" ref="area">
                        <div
                            class="mapa-container"
                            @wheel.prevent="handleWheel"
                            @dblclick="resetZoom"
                            @mousedown="startPan"
                            @mousemove="handleMouseMove"
                            @mouseup="endPan"
                            @mouseleave="handleMouseLeave"
                            :style="{ cursor: isPanning ? 'grabbing' : 'grab' }"
                        >
                            <div
                                v-html="svgContent"
                                class="mapa-svg"
                                :style="{ transform: 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')', transformOrigin: 'center center', transition: isPanning ? 'none' : 'transform 0.1s ease-out' }"
                            ></div>
                        </div>
                        <div class="mapa-tooltip" v-if="tooltip" :class="{ 'a-esquerda': tooltip.aEsquerda }" :style="{ left: tooltip.x + 'px', top: tooltip.y + 'px' }">
                            <div class="mapa-tooltip-nome">{{ tooltip.nome }}</div>
                            <div class="mapa-tooltip-atributo" v-for="a in tooltip.atributos" :key="a.rotulo">
                                <span class="mapa-tooltip-rotulo">{{ a.rotulo }}:</span> {{ a.valor }}
                            </div>
                        </div>
                        <div class="mapa-legenda" v-if="legenda.length">
                            <div class="mapa-legenda-titulo">Legenda</div>
                            <div class="mapa-legenda-item" v-for="item in legenda" :key="item.cor + item.rotulo" :title="item.detalhe || item.rotulo">
                                <span class="mapa-legenda-cor" :style="{ backgroundColor: item.cor }"></span>
                                <span class="mapa-legenda-rotulo">{{ item.rotulo }}</span>
                            </div>
                        </div>
                    </div>
                    <div class="mapa-botoes">
                        <button class="execute-btn" @click="executar">▶️ Executar</button>
                        <button class="reset-btn" @click="resetarMapa" title="Para a execução e limpa o mapa">⏹️ Parar / Resetar</button>
                        <label class="velocidade-ctrl" title="Velocidade da pintura">
                            <span>🐢</span>
                            <input type="range" min="1" max="10" step="1" v-model.number="velocidade">
                            <span>🐇</span>
                            <span class="velocidade-valor">{{ intervaloMs }} ms</span>
                        </label>
                    </div>
                </div>
            `,
            async mounted() {
                await this.carregarMapa();
                window.pintarPais = this.pintarPais;
                window.intervaloPintura = this.intervaloMs;
                window.atualizarLegenda = (itens, colunas = []) => {
                    this.legenda = itens;
                    this.colunasVisualizadas = colunas;
                };
            },
            watch: {
                // O laço gerado pelo BlocklyPanel lê esse valor a cada país
                intervaloMs(valor) {
                    window.intervaloPintura = valor;
                },
                // O mapeamento chega depois do mounted (fetch no componente raiz),
                // entao refazemos o recorte quando ele finalmente carrega.
                paisesIsoMapping() {
                    if (this.svgContent) this.ajustarViewBox();
                }
            },
            methods: {
                executar() {
                    // O código é gerado e executado pelo BlocklyPanel
                    if (window.executarCodigo) {
                        window.executarCodigo();
                    } else {
                        console.warn('⚠️ Blockly ainda não está pronto');
                    }
                },
                async carregarMapa() {
                    try {
                        const response = await fetch('src/assets/svg/america_map.svg');
                        this.svgContent = await response.text();
                        await this.$nextTick();
                        this.ocultarNaoAmericanos();
                        this.adicionarAguaGrandesLagos();
                        this.ajustarViewBox();
                        console.log('✅ Mapa carregado');
                    } catch (error) {
                        console.error('❌ Erro ao carregar mapa:', error);
                    }
                },
                handleWheel(event) {
                    // Calcular novo zoom
                    const delta = event.deltaY > 0 ? -0.1 : 0.1;
                    const newScale = Math.max(0.5, Math.min(5, this.scale + delta));

                    this.scale = newScale;
                },
                // O arquivo de origem e um mapa-mundi recortado, entao ainda traz
                // territorios que nao fazem parte das Americas.
                ocultarNaoAmericanos() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    // gl = Groenlandia, is = Islandia, aq = Antartida,
                    // ck/ki/pf/pn = ilhas do Pacifico.
                    for (const codigoISO of ['gl', 'is', 'aq', 'ck', 'ki', 'pf', 'pn']) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (elemento) elemento.remove();
                    }
                },
                // Os Grandes Lagos nao sao elementos do SVG: sao buracos recortados
                // nos caminhos dos EUA/Canada, entao mostram o fundo da pagina.
                // Colocamos um poligono azul ATRAS de tudo, so na regiao dos lagos
                // (coordenadas do viewBox original), para os buracos ficarem azuis.
                // O canto inferior direito e chanfrado para nao vazar no Atlantico.
                adicionarAguaGrandesLagos() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg || svg.querySelector('#grandes-lagos')) return;

                    const poligono = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    poligono.setAttribute('id', 'grandes-lagos');
                    poligono.setAttribute('points', '1436,-18 1668,-18 1668,115 1640,134 1436,134');
                    svg.insertBefore(poligono, svg.firstChild);
                },
                // O viewBox do arquivo (2752x1537) e bem maior que o desenho das
                // Americas, o que deixava muita area vazia em volta. Aqui medimos
                // a caixa real dos paises e recortamos o viewBox nela.
                ajustarViewBox() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    const bbox = this.medirPaises(svg) || this.medirTudo(svg);
                    if (!bbox) return;

                    // Margem pequena para o traco das bordas nao ficar cortado.
                    const margem = Math.max(bbox.width, bbox.height) * 0.02;
                    const x = bbox.x - margem;
                    const y = bbox.y - margem;
                    const largura = bbox.width + margem * 2;
                    const altura = bbox.height + margem * 2;

                    svg.setAttribute('viewBox', `${x} ${y} ${largura} ${altura}`);
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    // Sem width/height fixos o SVG passa a ocupar o painel inteiro
                    // seguindo a proporcao do novo viewBox.
                    svg.removeAttribute('width');
                    svg.removeAttribute('height');
                },
                // Medimos so os paises da base: o arquivo e um mapa-mundi recortado
                // e ainda carrega territorios distantes (Ilhas Cook, Kiribati,
                // Polinesia Francesa, Islandia, Antartida) que esticariam a caixa.
                medirPaises(svg) {
                    // getBBox() devolve coordenadas no espaco local do elemento e
                    // varios grupos deste SVG tem transform="matrix(2.19...)". Por
                    // isso convertemos cada caixa para o espaco da raiz via CTM.
                    const ctmRaiz = svg.getScreenCTM();
                    if (!ctmRaiz) return null;
                    const paraRaiz = ctmRaiz.inverse();

                    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;

                    for (const codigoISO of Object.values(this.paisesIsoMapping || {})) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (!elemento) continue;

                        let caixa, ctm;
                        try {
                            caixa = elemento.getBBox();
                            ctm = elemento.getScreenCTM();
                        } catch (error) {
                            continue;
                        }
                        if (!ctm || (!caixa.width && !caixa.height)) continue;

                        const m = paraRaiz.multiply(ctm);
                        const cantos = [
                            [caixa.x, caixa.y],
                            [caixa.x + caixa.width, caixa.y],
                            [caixa.x, caixa.y + caixa.height],
                            [caixa.x + caixa.width, caixa.y + caixa.height]
                        ];

                        for (const [cx, cy] of cantos) {
                            const ponto = svg.createSVGPoint();
                            ponto.x = cx;
                            ponto.y = cy;
                            const p = ponto.matrixTransform(m);
                            x1 = Math.min(x1, p.x);
                            y1 = Math.min(y1, p.y);
                            x2 = Math.max(x2, p.x);
                            y2 = Math.max(y2, p.y);
                        }
                    }

                    if (!Number.isFinite(x1)) return null;

                    return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
                },
                medirTudo(svg) {
                    try {
                        const caixa = svg.getBBox();
                        return caixa.width && caixa.height ? caixa : null;
                    } catch (error) {
                        console.warn('⚠️ Nao foi possivel medir o mapa:', error);
                        return null;
                    }
                },
                resetZoom() {
                    this.scale = 1;
                    this.translateX = 0;
                    this.translateY = 0;
                },
                startPan(event) {
                    this.isPanning = true;
                    this.startPanX = event.clientX - this.translateX;
                    this.startPanY = event.clientY - this.translateY;
                },
                handlePan(event) {
                    if (!this.isPanning) return;

                    this.translateX = event.clientX - this.startPanX;
                    this.translateY = event.clientY - this.startPanY;
                },
                endPan() {
                    this.isPanning = false;
                },
                handleMouseMove(event) {
                    this.handlePan(event);
                    this.atualizarTooltip(event);
                },
                handleMouseLeave() {
                    this.endPan();
                    this.tooltip = null;
                },
                // Sobe do elemento sob o mouse até achar um id que seja código
                // ISO de país (os países do SVG têm sub-paths sem id útil)
                paisSobMouse(alvo) {
                    for (let el = alvo; el && el !== this.$el; el = el.parentElement) {
                        if (el.id && this.paisPorISO[el.id]) return this.paisPorISO[el.id];
                    }
                    return null;
                },
                atualizarTooltip(event) {
                    if (this.isPanning) { this.tooltip = null; return; }
                    const pais = this.paisSobMouse(event.target);
                    if (!pais) { this.tooltip = null; return; }

                    // o tooltip e posicionado dentro de .mapa-area (nao do painel)
                    const caixa = this.$refs.area.getBoundingClientRect();
                    this.tooltip = {
                        nome: pais['País'],
                        // na ordem das colunas dos dados, não dos blocos
                        atributos: Object.keys(pais)
                            .filter(c => this.colunasVisualizadas.includes(c))
                            .map(c => ({ rotulo: c, valor: pais[c] })),
                        x: event.clientX - caixa.left,
                        y: event.clientY - caixa.top,
                        // Na metade direita do painel o tooltip abre para a
                        // esquerda do cursor, senão seria cortado pela borda
                        aEsquerda: event.clientX - caixa.left > caixa.width / 2
                    };
                },
                resetarMapa() {
                    // Para o laço em andamento, senão ele continuaria
                    // pintando por cima do mapa recém-limpo
                    if (window.pararExecucao) window.pararExecucao();
                    this.legenda = [];
                    this.colunasVisualizadas = [];

                    // Devolve a cor cinza original do SVG a todos os paises mapeados
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    // Ao pintar, a cor faz um fade (transition de fill no CSS);
                    // no reset a volta ao cinza deve ser imediata. A classe
                    // desliga a transition e o getBoundingClientRect força o
                    // navegador a aplicar isso antes das mudanças de fill;
                    // sem ele, a classe e o fill cairiam no mesmo repaint e
                    // o fade aconteceria mesmo assim.
                    const mapa = svg.parentElement;
                    mapa.classList.add('sem-transicao');
                    svg.getBoundingClientRect();

                    for (const codigoISO of Object.values(this.paisesIsoMapping || {})) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (!elemento) continue;

                        const alvos = [elemento, ...elemento.querySelectorAll('path, polygon, circle, rect, ellipse')];
                        alvos.forEach(el => {
                            el.style.fill = COR_PADRAO_PAIS;
                            el.setAttribute('fill', COR_PADRAO_PAIS);
                        });
                    }

                    // Reativa o fade só depois do repaint com o cinza
                    svg.getBoundingClientRect();
                    mapa.classList.remove('sem-transicao');
                    console.log('🔄 Mapa resetado');
                },
                pintarPais(nomePais, cor) {
                    console.log(`🎨 Tentando pintar: ${nomePais} de ${cor}`);

                    const codigoISO = this.paisesIsoMapping[nomePais];
                    console.log(`🔍 Código ISO: ${codigoISO}`);

                    if (!codigoISO) {
                        console.warn(`⚠️ País não encontrado no mapeamento: ${nomePais}`);
                        return;
                    }

                    const svg = this.$el.querySelector('svg');
                    console.log(`📊 SVG encontrado:`, svg ? 'SIM' : 'NÃO');

                    if (!svg) {
                        console.error('❌ SVG não encontrado no DOM');
                        return;
                    }

                    // Usar querySelector ao invés de getElementById
                    let elemento = svg.querySelector(`#${codigoISO}`);
                    console.log(`🗺️ Elemento ${codigoISO}:`, elemento ? 'ENCONTRADO' : 'NÃO ENCONTRADO');

                    if (elemento) {
                        // Pintar o elemento principal
                        elemento.style.fill = cor;
                        elemento.setAttribute('fill', cor);

                        // Pintar todos os paths filhos (caso seja um grupo)
                        const paths = elemento.querySelectorAll('path, polygon, circle, rect, ellipse');
                        paths.forEach(path => {
                            path.style.fill = cor;
                            path.setAttribute('fill', cor);
                        });

                        console.log(`✅ ${nomePais} (${codigoISO}) pintado de ${cor} (${paths.length} elementos)`);
                    } else {
                        console.warn(`⚠️ Elemento SVG não encontrado para: ${codigoISO}`);
                        // Listar alguns IDs disponíveis para debug
                        const ids = Array.from(svg.querySelectorAll('[id]')).map(el => el.id).slice(0, 10);
                        console.log('IDs disponíveis (primeiros 10):', ids);
                    }
                }
            }
        };

        // App principal
        const app = createApp({
            components: {
                DadosPanel,
                BlocklyPanel,
                MapaPanel
            },
            data() {
                return {
                    paises: [],
                    paisesISOMapping: {},
                    loading: true,
                    panelWidths: [
                        300,  // Painel de dados mais estreito
                        window.innerWidth / 3
                    ],
                    isResizing: false,
                    currentResizer: null,
                    startX: 0,
                    startWidth: 0
                };
            },
            async mounted() {
                await this.carregarDados();
                document.addEventListener('mousemove', this.handleMouseMove);
                document.addEventListener('mouseup', this.stopResize);
            },
            beforeUnmount() {
                document.removeEventListener('mousemove', this.handleMouseMove);
                document.removeEventListener('mouseup', this.stopResize);
            },
            methods: {
                async carregarDados() {
                    try {
                        // Adicionar timestamp para evitar cache
                        const timestamp = new Date().getTime();
                        const [resPaises, resISO] = await Promise.all([
                            fetch(`src/assets/data/paises_data.json?v=${timestamp}`),
                            fetch(`src/assets/data/paises_iso_mapping.json?v=${timestamp}`)
                        ]);

                        this.paises = await resPaises.json();
                        this.paisesISOMapping = await resISO.json();

                        this.loading = false;
                        console.log('✅ Dados carregados');
                        console.log('📋 Primeiros países:', this.paises.slice(0, 3).map(p => p['País']));
                    } catch (error) {
                        console.error('❌ Erro:', error);
                        alert('Erro ao carregar dados. Veja o console.');
                    }
                },
                startResize(panelIndex, event) {
                    this.isResizing = true;
                    this.currentResizer = panelIndex;
                    this.startX = event.clientX;
                    this.startWidth = this.panelWidths[panelIndex];
                    event.preventDefault();
                },
                handleMouseMove(event) {
                    if (!this.isResizing) return;

                    const delta = event.clientX - this.startX;
                    const newWidth = this.startWidth + delta;

                    // Largura mínima de 200px
                    if (newWidth >= 200) {
                        this.panelWidths[this.currentResizer] = newWidth;

                        // Se estiver redimensionando o painel do Blockly, atualizar workspace
                        if (this.currentResizer === 1 && window.resizeBlockly) {
                            window.resizeBlockly();
                        }
                    }
                },
                stopResize() {
                    if (this.isResizing) {
                        this.isResizing = false;
                        this.currentResizer = null;

                        // Atualizar workspace do Blockly após redimensionamento
                        if (window.resizeBlockly) {
                            setTimeout(() => {
                                window.resizeBlockly();
                            }, 50);
                        }
                    }
                }
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
