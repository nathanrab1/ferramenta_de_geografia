<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramenta de Regionalização - CLIC Geografia</title>

    <!-- CSS -->
    <!-- ?v= forca o navegador a baixar o CSS de novo quando ele muda -->
    <link rel="stylesheet" href="src/styles/colors.css?v=13">
    <link rel="stylesheet" href="src/styles/main.css?v=14">

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Blockly -->
    <script src="https://unpkg.com/blockly@10/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/msg/pt-br.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sem continente na URL: tela inicial de escolha -->
        <tela-inicial v-if="!continente"></tela-inicial>
        <template v-else-if="!loading">
            <dados-panel :paises="paisesOrdenados" v-model:coluna="colunaSelecionada" v-model:ordenacao="ordenacaoAtual" :style="{ width: panelWidths[0] + 'px' }" @largura="ajustarPainelDados"></dados-panel>
            <div class="resizer" @pointerdown="startResize(0, $event)"></div>
            <blockly-panel ref="blockly" :paises="paisesOrdenados" :coluna="colunaSelecionada" :continente="continente" :style="{ width: panelWidths[1] + 'px' }" @baixar-projeto="baixarProjeto" @abrir-projeto="abrirProjeto" @trocar-continente="trocarContinente"></blockly-panel>
            <div class="resizer" @pointerdown="startResize(1, $event)"></div>
            <mapa-panel :paises="paises" :paises-iso-mapping="paisesISOMapping" :continente="continente"></mapa-panel>
        </template>
        <div v-else class="carregando">
            <h2>⏳ Carregando...</h2>
        </div>
    </div>

    <!-- Componentes e App -->
    <script type="module">
        import BlocklyPanel from './src/components/BlocklyPanel.js';
        import { ORDENACAO_PADRAO, ordenarPaises, definirOrdemValores } from './src/utils/ordenacao.js';
        import { CONTINENTES, LISTA_CONTINENTES, arquivosDoContinente, continenteDaURL, urlDoContinente } from './src/continentes.js';

        const { createApp } = Vue;

        // Componente: TelaInicial (escolha do continente). Os cartões são
        // links: abrir um continente recarrega a página com ?continente=id,
        // o que também serve de link direto para os alunos.
        const TelaInicial = {
            name: 'TelaInicial',
            data() {
                return { continentes: LISTA_CONTINENTES };
            },
            template: `
                <div class="tela-inicial">
                    <header class="tela-inicial-cabecalho">
                        <h1>Ferramenta de Regionalização</h1>
                        <p>Escolha o continente que você vai regionalizar</p>
                    </header>
                    <div class="continentes">
                        <component
                            v-for="c in continentes" :key="c.id"
                            :is="c.disponivel ? 'a' : 'div'"
                            :href="c.disponivel ? urlDo(c) : null"
                            class="continente-cartao"
                            :class="{ indisponivel: !c.disponivel }"
                            :aria-disabled="!c.disponivel"
                        >
                            <span class="continente-icone" aria-hidden="true">{{ c.icone }}</span>
                            <span class="continente-nome">{{ c.nome }}</span>
                            <span class="continente-descricao">{{ c.descricao }}</span>
                            <span v-if="!c.disponivel" class="continente-etiqueta">Em breve</span>
                        </component>
                    </div>
                    <footer class="tela-inicial-rodape">CLIC · Geografia</footer>
                </div>
            `,
            methods: {
                urlDo: urlDoContinente
            }
        };

        // Componente: DadosPanel
        const DadosPanel = {
            name: 'DadosPanel',
            // paises: já na ordem escolhida (o App ordena).
            // coluna: a coluna exibida na tabela. Fica no App (v-model)
            // porque também define qual workspace o BlocklyPanel mostra.
            // ordenacao: {por: 'País' | 'valor', direcao: 'asc' | 'desc'},
            // escolhida clicando nos cabeçalhos; também no App (v-model),
            // que lembra uma ordenação por coluna
            props: ['paises', 'coluna', 'ordenacao'],
            emits: ['largura', 'update:coluna', 'update:ordenacao'],
            watch: {
                // Ao trocar a coluna ou a ordenação (ou carregar os dados),
                // avisa o App a largura que a tabela precisa para o painel
                // se ajustar
                coluna: 'emitirLargura',
                ordenacao: 'emitirLargura',
                paises: 'emitirLargura'
            },
            mounted() {
                this.emitirLargura();
            },
            computed: {
                // Todas as colunas dos dados, exceto o nome do país e as
                // coordenadas do mapa (uso interno)
                colunas() {
                    if (!this.paises.length) return [];
                    return Object.keys(this.paises[0])
                        .filter(c => c !== 'País' && !c.startsWith('Coordenada'));
                },
                // Colunas numéricas são alinhadas à direita
                colunaNumerica() {
                    return this.paises.some(p => typeof p[this.coluna] === 'number');
                }
            },
            template: `
                <div class="panel dados-panel">
                    <div class="painel-cabecalho coluna-seletor">
                        <label for="coluna-select">Visualizar coluna:</label>
                        <select id="coluna-select" :value="coluna" @change="$emit('update:coluna', $event.target.value)">
                            <option v-for="coluna in colunas" :key="coluna" :value="coluna">
                                {{ coluna }}
                            </option>
                        </select>
                    </div>
                    <div class="tabela-scroll">
                        <table class="dados-table" ref="tabela">
                            <thead>
                                <tr>
                                    <th class="ordenavel" :class="{ ativa: ordenacao.por === 'País' }" @click="ordenarPor('País')" title="Ordenar por nome do país">
                                        País <span class="seta">{{ seta('País') }}</span>
                                    </th>
                                    <th class="ordenavel" :class="{ numerico: colunaNumerica, ativa: ordenacao.por === 'valor' }" @click="ordenarPor('valor')" title="Ordenar por esta coluna">
                                        {{ coluna }} <span class="seta">{{ seta('valor') }}</span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="pais in paises" :key="pais['País']">
                                    <td><strong>{{ pais['País'] }}</strong></td>
                                    <td :class="{ numerico: colunaNumerica }">{{ formatarValor(pais[coluna], coluna) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            methods: {
                // Clique no cabeçalho: se já ordena por ele, inverte a
                // direção; senão passa a ordenar por ele, crescente
                ordenarPor(por) {
                    const direcao = this.ordenacao.por === por && this.ordenacao.direcao === 'asc'
                        ? 'desc' : 'asc';
                    this.$emit('update:ordenacao', { por, direcao });
                },
                // Seta do cabeçalho: ▲/▼ no ativo, ⇅ apagado nos demais
                seta(por) {
                    if (this.ordenacao.por !== por) return '⇅';
                    return this.ordenacao.direcao === 'asc' ? '▲' : '▼';
                },
                emitirLargura() {
                    this.$nextTick(() => {
                        const tabela = this.$refs.tabela;
                        if (!tabela) return;
                        // O padding fica na área de rolagem (.tabela-scroll), não no painel
                        const estilo = getComputedStyle(tabela.parentElement);
                        const padding = parseFloat(estilo.paddingLeft) + parseFloat(estilo.paddingRight);
                        // Folga para a barra de rolagem vertical do painel
                        this.$emit('largura', Math.ceil(tabela.offsetWidth + padding + 20));
                    });
                },
                formatarValor(valor, coluna) {
                    if (valor === null || valor === undefined) return '-';
                    if (typeof valor !== 'number') return valor;
                    // Formato brasileiro: vírgula decimal e ponto de milhar.
                    // Casas decimais por coluna (demais são inteiras); o PIB
                    // mostra até 3 casas para os países muito pequenos
                    // (Tuvalu: 0,065 bilhão) sem poluir os grandes (2.124,0)
                    const casas = { 'IDH': [3, 3], 'PIB (Bilhões de Dolares)': [1, 3] }[coluna] ?? [0, 0];
                    return valor.toLocaleString('pt-BR', {
                        minimumFractionDigits: casas[0], maximumFractionDigits: casas[1]
                    });
                }
            }
        };

        // Cinza dos países ainda não pintados (fill original dos SVGs)
        const COR_PADRAO_PAIS = '#787878';

        // Identificação do arquivo de projeto (.json): formato e versão,
        // para recusar arquivos de outra origem ou de versões futuras.
        // Versão 2: passou a gravar o continente (a 1 era só a América).
        const PROJETO_FORMATO = 'clic-regionalizacao';
        const PROJETO_VERSAO = 2;
        // Projeto de outro continente guardado enquanto a página recarrega
        // com o continente certo (veja abrirProjeto)
        const CHAVE_PROJETO_PENDENTE = 'clic-regionalizacao-projeto-pendente';

        // Componente: MapaPanel
        const MapaPanel = {
            name: 'MapaPanel',
            // continente: entrada de src/continentes.js (arquivo do mapa,
            // territórios a ocultar e ajustes do SVG)
            props: ['paises', 'paisesIsoMapping', 'continente'],
            data() {
                return {
                    svgContent: '',
                    // Controles de zoom e pan
                    scale: 1,
                    translateX: 0,
                    translateY: 0,
                    isPanning: false,
                    startPanX: 0,
                    startPanY: 0,
                    // Ponteiros (mouse, dedos, caneta) apoiados no mapa:
                    // id -> {x, y}. Um ponteiro arrasta; dois fazem pinça.
                    ponteiros: new Map(),
                    // Se o gesto atual chegou a mover o mapa: um toque que
                    // não move é um "tap" (tooltip / duplo toque)
                    gestoMoveu: false,
                    ultimoToque: null,
                    // Velocidade da pintura (1 = lento ... 10 = rápido)
                    velocidade: 9,
                    // Itens {cor, rotulo, detalhe} montados pelo
                    // BlocklyPanel a partir dos blocos, ao executar
                    legenda: [],
                    // Colunas usadas nos blocos "se" da última execução;
                    // aparecem no tooltip de cada país
                    colunasVisualizadas: [],
                    // Tooltip do país sob o mouse: { nome, atributos: [{rotulo, valor}], x, y }
                    tooltip: null
                };
            },
            computed: {
                // Código ISO (id no SVG) -> registro do país, para o tooltip
                paisPorISO() {
                    const porNome = Object.fromEntries((this.paises || []).map(p => [p['País'], p]));
                    const mapa = {};
                    for (const [nome, iso] of Object.entries(this.paisesIsoMapping || {})) {
                        mapa[iso] = porNome[nome] || { 'País': nome };
                    }
                    return mapa;
                },
                // Pausa entre países em ms: 1000ms (lento) ... 100ms (rápido)
                intervaloMs() {
                    return (11 - this.velocidade) * 100;
                }
            },
            template: `
                <div class="panel mapa-panel">
                    <div class="mapa-area" ref="area">
                        <div
                            class="mapa-container"
                            @wheel.prevent="handleWheel"
                            @dblclick="resetZoom"
                            @pointerdown="onPointerDown"
                            @pointermove="onPointerMove"
                            @pointerup="onPointerUp"
                            @pointercancel="onPointerUp"
                            @pointerleave="onPointerLeave"
                            :style="{ cursor: isPanning ? 'grabbing' : 'grab' }"
                        >
                            <div
                                v-html="svgContent"
                                class="mapa-svg"
                                :style="{ transform: 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')', transformOrigin: 'center center', transition: isPanning ? 'none' : 'transform 0.1s ease-out' }"
                            ></div>
                        </div>
                        <div class="mapa-tooltip" v-if="tooltip" :class="{ 'a-esquerda': tooltip.aEsquerda }" :style="{ left: tooltip.x + 'px', top: tooltip.y + 'px' }">
                            <div class="mapa-tooltip-nome">{{ tooltip.nome }}</div>
                            <div class="mapa-tooltip-atributo" v-for="a in tooltip.atributos" :key="a.rotulo">
                                <span class="mapa-tooltip-rotulo">{{ a.rotulo }}:</span> {{ a.valor }}
                            </div>
                        </div>
                        <div class="mapa-legenda" v-if="legenda.length">
                            <div class="mapa-legenda-titulo">Legenda</div>
                            <div class="mapa-legenda-item" v-for="item in legenda" :key="item.cor + item.rotulo" :title="item.detalhe || item.rotulo">
                                <span class="mapa-legenda-cor" :style="{ backgroundColor: item.cor }"></span>
                                <span class="mapa-legenda-rotulo">{{ item.rotulo }}</span>
                            </div>
                        </div>
                    </div>
                    <div class="mapa-botoes">
                        <button class="execute-btn" @click="executar">▶️ Executar</button>
                        <button class="reset-btn" @click="resetarMapa" title="Para a execução e limpa o mapa">⏹️ Parar / Resetar</button>
                        <label class="velocidade-ctrl" title="Velocidade da pintura">
                            <span>🐢</span>
                            <input type="range" min="1" max="10" step="1" v-model.number="velocidade">
                            <span>🐇</span>
                            <span class="velocidade-valor">{{ intervaloMs }} ms</span>
                        </label>
                    </div>
                </div>
            `,
            async mounted() {
                await this.carregarMapa();
                window.pintarPais = this.pintarPais;
                // Chamado pelo App ao trocar a coluna da tabela
                window.resetarMapa = this.resetarMapa;
                window.intervaloPintura = this.intervaloMs;
                window.atualizarLegenda = (itens, colunas = []) => {
                    this.legenda = itens;
                    this.colunasVisualizadas = colunas;
                };
            },
            watch: {
                // O laço gerado pelo BlocklyPanel lê esse valor a cada país
                intervaloMs(valor) {
                    window.intervaloPintura = valor;
                },
                // O mapeamento chega depois do mounted (fetch no componente raiz),
                // entao refazemos o recorte quando ele finalmente carrega.
                paisesIsoMapping() {
                    if (this.svgContent) this.ajustarViewBox();
                }
            },
            methods: {
                executar() {
                    // O código é gerado e executado pelo BlocklyPanel
                    if (window.executarCodigo) {
                        window.executarCodigo();
                    } else {
                        console.warn('⚠️ Blockly ainda não está pronto');
                    }
                },
                async carregarMapa() {
                    try {
                        const response = await fetch(arquivosDoContinente(this.continente).mapa);
                        this.svgContent = await response.text();
                        await this.$nextTick();
                        this.ocultarForaDoContinente();
                        const svg = this.$el.querySelector('svg');
                        if (svg && this.continente.prepararMapa) this.continente.prepararMapa(svg);
                        this.ajustarViewBox();
                        console.log('✅ Mapa carregado');
                    } catch (error) {
                        console.error('❌ Erro ao carregar mapa:', error);
                    }
                },
                // Zoom multiplicativo e proporcional ao giro: um dente da
                // roda do mouse (deltaY ~100) amplia ~22%, em qualquer escala;
                // o trackpad manda muitos deltas pequenos, então fica suave.
                // O delta é limitado para um giro forte não dar um salto.
                handleWheel(event) {
                    const delta = Math.max(-200, Math.min(200, event.deltaY));
                    const fator = Math.exp(-delta * 0.002);
                    this.aplicarZoom(this.scale * fator, event.clientX, event.clientY);
                },
                // Zoom ancorado no ponto (clientX, clientY): o ponto do mapa
                // que está ali continua ali depois da mudança de escala.
                // O transform é translate(t) scale(s) com origem no centro C
                // do container, então um ponto p do mapa vai parar em
                // C + t + s*(p - C). Mantendo M = C + t + s*(p - C) para a
                // nova escala s', a translação vira
                // t' = (M - C) - (s'/s) * (M - C - t).
                aplicarZoom(escala, clientX, clientY) {
                    const novaEscala = Math.max(0.5, Math.min(5, escala));
                    if (novaEscala === this.scale) return;
                    const caixa = this.$refs.area.getBoundingClientRect();
                    const mx = clientX - caixa.left - caixa.width / 2;
                    const my = clientY - caixa.top - caixa.height / 2;
                    const razao = novaEscala / this.scale;
                    this.translateX = mx - razao * (mx - this.translateX);
                    this.translateY = my - razao * (my - this.translateY);
                    this.scale = novaEscala;
                },
                // Remove do mapa os territórios listados em continente.ocultar
                // (os arquivos de origem são mapas-múndi recortados, então
                // ainda trazem terras que não fazem parte do continente)
                ocultarForaDoContinente() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    for (const codigoISO of this.continente.ocultar || []) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (elemento) elemento.remove();
                    }
                },
                // O viewBox do arquivo costuma ser bem maior que o desenho do
                // continente, o que deixava muita área vazia em volta. Aqui
                // medimos a caixa real dos países e recortamos o viewBox nela.
                ajustarViewBox() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    const bbox = this.medirPaises(svg) || this.medirTudo(svg);
                    if (!bbox) return;

                    // Margem pequena para o traco das bordas nao ficar cortado.
                    const margem = Math.max(bbox.width, bbox.height) * 0.02;
                    const x = bbox.x - margem;
                    const y = bbox.y - margem;
                    const largura = bbox.width + margem * 2;
                    const altura = bbox.height + margem * 2;

                    svg.setAttribute('viewBox', `${x} ${y} ${largura} ${altura}`);
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    // Fronteiras com a mesma espessura visual em qualquer mapa
                    // (a referência é a largura do mapa das Américas)
                    svg.style.setProperty('--traco', (largura / 750).toFixed(3));
                    // Sem width/height fixos o SVG passa a ocupar o painel inteiro
                    // seguindo a proporcao do novo viewBox.
                    svg.removeAttribute('width');
                    svg.removeAttribute('height');
                },
                // Medimos só os países da base: o arquivo pode trazer territórios
                // distantes (na América: Ilhas Cook, Kiribati, Polinésia Francesa,
                // Antártida...) que esticariam a caixa.
                medirPaises(svg) {
                    // getBBox() devolve coordenadas no espaco local do elemento e
                    // varios grupos deste SVG tem transform="matrix(2.19...)". Por
                    // isso convertemos cada caixa para o espaco da raiz via CTM.
                    const ctmRaiz = svg.getScreenCTM();
                    if (!ctmRaiz) return null;
                    const paraRaiz = ctmRaiz.inverse();

                    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;

                    for (const codigoISO of Object.values(this.paisesIsoMapping || {})) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (!elemento) continue;

                        let caixa, ctm;
                        try {
                            caixa = elemento.getBBox();
                            ctm = elemento.getScreenCTM();
                        } catch (error) {
                            continue;
                        }
                        if (!ctm || (!caixa.width && !caixa.height)) continue;

                        const m = paraRaiz.multiply(ctm);
                        const cantos = [
                            [caixa.x, caixa.y],
                            [caixa.x + caixa.width, caixa.y],
                            [caixa.x, caixa.y + caixa.height],
                            [caixa.x + caixa.width, caixa.y + caixa.height]
                        ];

                        for (const [cx, cy] of cantos) {
                            const ponto = svg.createSVGPoint();
                            ponto.x = cx;
                            ponto.y = cy;
                            const p = ponto.matrixTransform(m);
                            x1 = Math.min(x1, p.x);
                            y1 = Math.min(y1, p.y);
                            x2 = Math.max(x2, p.x);
                            y2 = Math.max(y2, p.y);
                        }
                    }

                    if (!Number.isFinite(x1)) return null;

                    return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
                },
                medirTudo(svg) {
                    try {
                        const caixa = svg.getBBox();
                        return caixa.width && caixa.height ? caixa : null;
                    } catch (error) {
                        console.warn('⚠️ Nao foi possivel medir o mapa:', error);
                        return null;
                    }
                },
                resetZoom() {
                    this.scale = 1;
                    this.translateX = 0;
                    this.translateY = 0;
                },
                // Pan e pinça com Pointer Events, que cobrem mouse, dedo e
                // caneta. O .mapa-container tem touch-action: none no CSS;
                // sem isso o iPad rolaria/ampliaria a página em vez de
                // entregar os movimentos ao mapa.
                onPointerDown(event) {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    // x0/y0: onde o ponteiro começou, para distinguir tap de arrasto
                    this.ponteiros.set(event.pointerId, { x: event.clientX, y: event.clientY, x0: event.clientX, y0: event.clientY });
                    if (this.ponteiros.size === 1) {
                        this.gestoMoveu = false;
                        this.iniciarPan(event.clientX, event.clientY);
                    }
                    this.isPanning = true;
                    this.tooltip = null;
                },
                iniciarPan(x, y) {
                    this.startPanX = x - this.translateX;
                    this.startPanY = y - this.translateY;
                },
                onPointerMove(event) {
                    const ponteiro = this.ponteiros.get(event.pointerId);
                    if (!ponteiro) {
                        // Mouse passeando sem botão apertado
                        if (event.pointerType === 'mouse') this.atualizarTooltip(event);
                        return;
                    }
                    if (this.ponteiros.size >= 2) {
                        this.moverPinca(ponteiro, event);
                    } else {
                        ponteiro.x = event.clientX;
                        ponteiro.y = event.clientY;
                        this.translateX = event.clientX - this.startPanX;
                        this.translateY = event.clientY - this.startPanY;
                    }
                    // Tolerância para o tremor do dedo num toque parado
                    if (this.ponteiros.size >= 2 || Math.hypot(event.clientX - ponteiro.x0, event.clientY - ponteiro.y0) > 8) {
                        this.gestoMoveu = true;
                    }
                },
                // Pinça: os dois primeiros dedos definem uma distância e um
                // ponto médio. A escala muda pela razão das distâncias,
                // ancorada no ponto médio antigo, e o mapa acompanha o
                // deslocamento do ponto médio.
                moverPinca(ponteiro, event) {
                    const [a, b] = [...this.ponteiros.values()];
                    const distAntes = Math.hypot(a.x - b.x, a.y - b.y);
                    const medioAntes = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    ponteiro.x = event.clientX;
                    ponteiro.y = event.clientY;
                    const distDepois = Math.hypot(a.x - b.x, a.y - b.y);
                    const medioDepois = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    if (distAntes > 0 && distDepois > 0) {
                        this.aplicarZoom(this.scale * distDepois / distAntes, medioAntes.x, medioAntes.y);
                    }
                    this.translateX += medioDepois.x - medioAntes.x;
                    this.translateY += medioDepois.y - medioAntes.y;
                },
                onPointerUp(event) {
                    if (!this.ponteiros.delete(event.pointerId)) return;
                    if (this.ponteiros.size === 1) {
                        // Da pinça para o arrasto: recomeça do dedo que ficou
                        const [restante] = this.ponteiros.values();
                        this.iniciarPan(restante.x, restante.y);
                    } else if (this.ponteiros.size === 0) {
                        this.isPanning = false;
                        if (event.pointerType !== 'mouse' && !this.gestoMoveu && event.type === 'pointerup') {
                            this.tratarToque(event);
                        }
                    }
                },
                onPointerLeave(event) {
                    // Só o mouse "sai" do mapa no meio do gesto; para o dedo
                    // o pointerleave vem depois do pointerup, já tratado
                    if (event.pointerType !== 'mouse') return;
                    this.ponteiros.delete(event.pointerId);
                    if (this.ponteiros.size === 0) this.isPanning = false;
                    this.tooltip = null;
                },
                // Toque sem arrastar: duplo toque reseta o zoom; toque num
                // país mostra o tooltip dele (no lugar do hover do mouse)
                tratarToque(event) {
                    const agora = Date.now();
                    const anterior = this.ultimoToque;
                    this.ultimoToque = { x: event.clientX, y: event.clientY, t: agora };
                    if (anterior && agora - anterior.t < 350
                        && Math.hypot(event.clientX - anterior.x, event.clientY - anterior.y) < 30) {
                        this.ultimoToque = null;
                        this.resetZoom();
                        return;
                    }
                    // Com o dedo o event.target é onde o toque começou;
                    // o elemento sob o ponto final é mais confiável
                    const alvo = document.elementFromPoint(event.clientX, event.clientY);
                    this.mostrarTooltip(this.paisSobMouse(alvo), event.clientX, event.clientY);
                },
                // Sobe do elemento sob o mouse até achar um id que seja código
                // ISO de país (os países do SVG têm sub-paths sem id útil)
                paisSobMouse(alvo) {
                    for (let el = alvo; el && el !== this.$el; el = el.parentElement) {
                        if (el.id && this.paisPorISO[el.id]) return this.paisPorISO[el.id];
                    }
                    return null;
                },
                atualizarTooltip(event) {
                    if (this.isPanning) { this.tooltip = null; return; }
                    this.mostrarTooltip(this.paisSobMouse(event.target), event.clientX, event.clientY);
                },
                mostrarTooltip(pais, clientX, clientY) {
                    if (!pais) { this.tooltip = null; return; }

                    // o tooltip e posicionado dentro de .mapa-area (nao do painel)
                    const caixa = this.$refs.area.getBoundingClientRect();
                    this.tooltip = {
                        nome: pais['País'],
                        // na ordem das colunas dos dados, não dos blocos
                        atributos: Object.keys(pais)
                            .filter(c => this.colunasVisualizadas.includes(c))
                            .map(c => ({ rotulo: c, valor: pais[c] ?? '-' })),
                        x: clientX - caixa.left,
                        y: clientY - caixa.top,
                        // Na metade direita do painel o tooltip abre para a
                        // esquerda do cursor, senão seria cortado pela borda
                        aEsquerda: clientX - caixa.left > caixa.width / 2
                    };
                },
                resetarMapa() {
                    // Para o laço em andamento, senão ele continuaria
                    // pintando por cima do mapa recém-limpo
                    if (window.pararExecucao) window.pararExecucao();
                    this.legenda = [];
                    this.colunasVisualizadas = [];

                    // Devolve a cor cinza original do SVG a todos os paises mapeados
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    // Ao pintar, a cor faz um fade (transition de fill no CSS);
                    // no reset a volta ao cinza deve ser imediata. A classe
                    // desliga a transition e o getBoundingClientRect força o
                    // navegador a aplicar isso antes das mudanças de fill;
                    // sem ele, a classe e o fill cairiam no mesmo repaint e
                    // o fade aconteceria mesmo assim.
                    const mapa = svg.parentElement;
                    mapa.classList.add('sem-transicao');
                    svg.getBoundingClientRect();

                    for (const codigoISO of Object.values(this.paisesIsoMapping || {})) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (!elemento) continue;

                        const alvos = [elemento, ...elemento.querySelectorAll('path, polygon, circle, rect, ellipse')];
                        alvos.forEach(el => {
                            el.style.fill = COR_PADRAO_PAIS;
                            el.setAttribute('fill', COR_PADRAO_PAIS);
                        });
                    }

                    // Reativa o fade só depois do repaint com o cinza
                    svg.getBoundingClientRect();
                    mapa.classList.remove('sem-transicao');
                    console.log('🔄 Mapa resetado');
                },
                pintarPais(nomePais, cor) {
                    console.log(`🎨 Tentando pintar: ${nomePais} de ${cor}`);

                    const codigoISO = this.paisesIsoMapping[nomePais];
                    console.log(`🔍 Código ISO: ${codigoISO}`);

                    if (!codigoISO) {
                        console.warn(`⚠️ País não encontrado no mapeamento: ${nomePais}`);
                        return;
                    }

                    const svg = this.$el.querySelector('svg');
                    console.log(`📊 SVG encontrado:`, svg ? 'SIM' : 'NÃO');

                    if (!svg) {
                        console.error('❌ SVG não encontrado no DOM');
                        return;
                    }

                    // Usar querySelector ao invés de getElementById
                    let elemento = svg.querySelector(`#${codigoISO}`);
                    console.log(`🗺️ Elemento ${codigoISO}:`, elemento ? 'ENCONTRADO' : 'NÃO ENCONTRADO');

                    if (elemento) {
                        // Pintar o elemento principal
                        elemento.style.fill = cor;
                        elemento.setAttribute('fill', cor);

                        // Pintar todos os paths filhos (caso seja um grupo)
                        const paths = elemento.querySelectorAll('path, polygon, circle, rect, ellipse');
                        paths.forEach(path => {
                            path.style.fill = cor;
                            path.setAttribute('fill', cor);
                        });

                        console.log(`✅ ${nomePais} (${codigoISO}) pintado de ${cor} (${paths.length} elementos)`);
                    } else {
                        console.warn(`⚠️ Elemento SVG não encontrado para: ${codigoISO}`);
                        // Listar alguns IDs disponíveis para debug
                        const ids = Array.from(svg.querySelectorAll('[id]')).map(el => el.id).slice(0, 10);
                        console.log('IDs disponíveis (primeiros 10):', ids);
                    }
                }
            }
        };

        // App principal
        const app = createApp({
            components: {
                TelaInicial,
                DadosPanel,
                BlocklyPanel,
                MapaPanel
            },
            data() {
                // Continente da URL (?continente=id); sem ele, tela inicial
                const continente = continenteDaURL();
                return {
                    continente,
                    paises: [],
                    paisesISOMapping: {},
                    loading: true,
                    // Coluna da tabela em exibição. Cada coluna tem o seu
                    // próprio workspace no BlocklyPanel (uma regionalização
                    // por coluna)
                    colunaSelecionada: continente ? continente.colunaInicial : null,
                    // Ordenação da tabela, lembrada por coluna (faz parte da
                    // regionalização daquela coluna, como o workspace).
                    // Colunas ausentes usam ORDENACAO_PADRAO.
                    ordenacoes: {},
                    panelWidths: [
                        300,  // Painel de dados mais estreito
                        window.innerWidth / 3
                    ],
                    isResizing: false,
                    currentResizer: null,
                    startX: 0,
                    startWidth: 0
                };
            },
            computed: {
                ordenacaoAtual: {
                    get() {
                        return this.ordenacoes[this.colunaSelecionada] || ORDENACAO_PADRAO;
                    },
                    set(ordenacao) {
                        this.ordenacoes[this.colunaSelecionada] = ordenacao;
                    }
                },
                // Países na ordem da tabela: é também a ordem em que o laço
                // "para cada país" pinta o mapa
                paisesOrdenados() {
                    return ordenarPaises(this.paises, this.colunaSelecionada, this.ordenacaoAtual);
                }
            },
            watch: {
                // Ao trocar a coluna, o mapa mostrava a regionalização de
                // outro workspace: volta ao cinza (e para a execução) até o
                // aluno executar o programa da nova coluna
                colunaSelecionada() {
                    if (window.resetarMapa) window.resetarMapa();
                }
            },
            async mounted() {
                if (!this.continente) return;
                document.title = `Regionalização da ${this.continente.nome} - CLIC Geografia`;
                definirOrdemValores(this.continente.ordemValores);
                await this.carregarDados();
                this.abrirProjetoPendente();
                // Pointer Events: o divisor também se arrasta com o dedo
                document.addEventListener('pointermove', this.handleMouseMove);
                document.addEventListener('pointerup', this.stopResize);
                document.addEventListener('pointercancel', this.stopResize);
            },
            beforeUnmount() {
                document.removeEventListener('pointermove', this.handleMouseMove);
                document.removeEventListener('pointerup', this.stopResize);
                document.removeEventListener('pointercancel', this.stopResize);
            },
            methods: {
                async carregarDados() {
                    try {
                        const arquivos = arquivosDoContinente(this.continente);
                        // Adicionar timestamp para evitar cache
                        const timestamp = new Date().getTime();
                        const [resPaises, resISO] = await Promise.all([
                            fetch(`${arquivos.paises}?v=${timestamp}`),
                            fetch(`${arquivos.iso}?v=${timestamp}`)
                        ]);

                        this.paises = await resPaises.json();
                        this.paisesISOMapping = await resISO.json();

                        this.loading = false;
                        console.log('✅ Dados carregados');
                        console.log('📋 Primeiros países:', this.paises.slice(0, 3).map(p => p['País']));
                    } catch (error) {
                        console.error('❌ Erro:', error);
                        alert('Erro ao carregar dados. Veja o console.');
                    }
                },
                // Botão "Baixar projeto": salva em um .json os blocos de
                // todas as colunas, a ordenação de cada uma e a coluna em
                // exibição, para abrir depois (ou em outro computador)
                baixarProjeto() {
                    const projeto = {
                        formato: PROJETO_FORMATO,
                        versao: PROJETO_VERSAO,
                        criadoEm: new Date().toISOString(),
                        continente: this.continente.id,
                        colunaSelecionada: this.colunaSelecionada,
                        ordenacoes: this.ordenacoes,
                        workspaces: this.$refs.blockly.exportarWorkspaces()
                    };
                    const blob = new Blob([JSON.stringify(projeto, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `regionalizacao-${this.continente.id}-${new Date().toISOString().slice(0, 10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                },
                // Botão "Abrir projeto": substitui o projeto atual pelo do
                // arquivo escolhido (já lido e parseado pelo BlocklyPanel)
                async abrirProjeto(projeto) {
                    if (!projeto || projeto.formato !== PROJETO_FORMATO) {
                        alert('Este arquivo não é um projeto da Ferramenta de Regionalização.');
                        return;
                    }
                    if (projeto.versao > PROJETO_VERSAO) {
                        alert('Este projeto foi salvo em uma versão mais nova da ferramenta e não pode ser aberto aqui.');
                        return;
                    }
                    // Projetos da versão 1 eram sempre da América
                    const idContinente = projeto.continente || 'america';
                    const outro = CONTINENTES[idContinente];
                    if (!outro || !outro.disponivel) {
                        alert(`Este projeto é de um continente que esta ferramenta ainda não tem (${idContinente}).`);
                        return;
                    }
                    // Só pergunta se há trabalho a perder
                    const temBlocos = Object.keys(this.$refs.blockly.exportarWorkspaces()).length > 0;
                    if (outro.id !== this.continente.id) {
                        const aviso = temBlocos ? ' Os blocos atuais serão perdidos.' : '';
                        if (!confirm(`Este projeto é da ${outro.nome}. Trocar para a ${outro.nome} e abrir o projeto?${aviso}`)) {
                            return;
                        }
                        // A página recarrega no outro continente e abre o
                        // projeto logo depois (veja abrirProjetoPendente)
                        sessionStorage.setItem(CHAVE_PROJETO_PENDENTE, JSON.stringify(projeto));
                        location.href = urlDoContinente(outro);
                        return;
                    }
                    if (temBlocos && !confirm('Abrir o projeto vai substituir os blocos atuais de todas as colunas. Continuar?')) {
                        return;
                    }

                    // Colunas que não existem mais nos dados são ignoradas
                    const colunas = Object.keys(this.paises[0] || {});
                    const workspaces = Object.fromEntries(
                        Object.entries(projeto.workspaces || {}).filter(([c]) => colunas.includes(c))
                    );
                    this.ordenacoes = Object.fromEntries(
                        Object.entries(projeto.ordenacoes || {}).filter(([c]) => colunas.includes(c))
                    );
                    if (colunas.includes(projeto.colunaSelecionada)) {
                        this.colunaSelecionada = projeto.colunaSelecionada;
                    }
                    // Espera o BlocklyPanel reagir à troca de coluna (se
                    // houve) antes de trocar os workspaces, senão a troca
                    // gravaria os blocos antigos por cima dos importados
                    await this.$nextTick();
                    if (window.resetarMapa) window.resetarMapa();
                    try {
                        this.$refs.blockly.importarWorkspaces(workspaces);
                    } catch (error) {
                        console.error('❌ Erro ao abrir projeto:', error);
                        alert('Não foi possível carregar os blocos deste projeto: ' + error.message);
                    }
                },
                // Projeto de outro continente deixado por abrirProjeto antes
                // de recarregar a página: abre assim que o Blockly existir
                abrirProjetoPendente() {
                    const texto = sessionStorage.getItem(CHAVE_PROJETO_PENDENTE);
                    if (!texto) return;
                    sessionStorage.removeItem(CHAVE_PROJETO_PENDENTE);
                    let projeto;
                    try {
                        projeto = JSON.parse(texto);
                    } catch (error) {
                        return;
                    }
                    if (projeto.continente !== this.continente.id) return;
                    // O BlocklyPanel só cria o workspace ~500ms depois de montar
                    const tentar = (restantes) => {
                        const blockly = this.$refs.blockly;
                        if (blockly && blockly.workspace) {
                            this.abrirProjeto(projeto);
                        } else if (restantes > 0) {
                            setTimeout(() => tentar(restantes - 1), 200);
                        }
                    };
                    tentar(25);
                },
                // Botão do continente no BlocklyPanel: volta à tela inicial
                // (recarrega a página sem ?continente). Os blocos ficam só
                // em memória, então avisa se houver trabalho a perder.
                trocarContinente() {
                    const temBlocos = Object.keys(this.$refs.blockly.exportarWorkspaces()).length > 0;
                    if (temBlocos && !confirm('Voltar à escolha de continente descarta os blocos atuais. Baixe o projeto antes se quiser guardá-los. Continuar?')) {
                        return;
                    }
                    location.href = location.pathname;
                },
                // Painel de dados sempre do tamanho da tabela (coluna atual)
                ajustarPainelDados(largura) {
                    this.panelWidths[0] = Math.max(200, largura);
                    if (window.resizeBlockly) {
                        this.$nextTick(() => window.resizeBlockly());
                    }
                },
                startResize(panelIndex, event) {
                    this.isResizing = true;
                    this.currentResizer = panelIndex;
                    this.startX = event.clientX;
                    this.startWidth = this.panelWidths[panelIndex];
                    event.preventDefault();
                },
                handleMouseMove(event) {
                    if (!this.isResizing) return;

                    const delta = event.clientX - this.startX;
                    const newWidth = this.startWidth + delta;

                    // Largura mínima de 200px
                    if (newWidth >= 200) {
                        this.panelWidths[this.currentResizer] = newWidth;

                        // Se estiver redimensionando o painel do Blockly, atualizar workspace
                        if (this.currentResizer === 1 && window.resizeBlockly) {
                            window.resizeBlockly();
                        }
                    }
                },
                stopResize() {
                    if (this.isResizing) {
                        this.isResizing = false;
                        this.currentResizer = null;

                        // Atualizar workspace do Blockly após redimensionamento
                        if (window.resizeBlockly) {
                            setTimeout(() => {
                                window.resizeBlockly();
                            }, 50);
                        }
                    }
                }
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
