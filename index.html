<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramenta de Regionalização - CLIC Geografia</title>

    <!-- CSS -->
    <!-- ?v= forca o navegador a baixar o CSS de novo quando ele muda -->
    <link rel="stylesheet" href="src/styles/colors.css?v=13">
    <link rel="stylesheet" href="src/styles/main.css?v=23">

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Blockly -->
    <script src="https://unpkg.com/blockly@10/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly@10/msg/pt-br.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sem continente na URL: tela inicial de escolha -->
        <tela-inicial v-if="!continente"></tela-inicial>
        <template v-else-if="!loading">
            <!-- v-show (e não v-if): na comparação os painéis só ficam
                 escondidos, para o BlocklyPanel não perder os blocos -->
            <div class="area-trabalho" v-show="!comparando">
                <dados-panel :paises="paisesOrdenados" v-model:coluna="colunaSelecionada" v-model:ordenacao="ordenacaoAtual" :pais-atual="paisEmExecucao" :pais-selecionado="paisSelecionado" :termos="termos" :rotulos-colunas="rotulosColunas" @selecionar-pais="selecionarPais" :style="{ width: panelWidths[0] + 'px' }" @largura="ajustarPainelDados">
                    <!-- Sala de aula: respostas do formulário -->
                    <template v-if="sala" #acoes>
                        <span class="sala-acoes">
                            <button v-if="sala.link" class="btn-contorno" @click="atualizarRespostas" :disabled="sala.carregando" title="Lê de novo a planilha, com as respostas enviadas desde a última leitura">{{ sala.carregando ? '⏳ Atualizando…' : '🔄 Atualizar respostas' }}</button>
                            <button class="btn-contorno" @click="configurandoSala = true" title="Trocar a planilha ou a pergunta com a posição na sala">⚙️ Planilha</button>
                            <span class="sala-contagem">{{ totalRespostas }} {{ totalRespostas === 1 ? 'resposta' : 'respostas' }}</span>
                        </span>
                    </template>
                </dados-panel>
                <div class="resizer" @pointerdown="startResize(0, $event)"></div>
                <blockly-panel ref="blockly" :paises="paisesOrdenados" :coluna="colunaSelecionada" :continente="continente" :style="{ width: panelWidths[1] + 'px' }" @baixar-projeto="baixarProjeto" @abrir-projeto="abrirProjeto" @trocar-continente="trocarContinente"></blockly-panel>
                <div class="resizer" @pointerdown="startResize(1, $event)"></div>
                <mapa-panel ref="mapa" :paises="paises" :paises-iso-mapping="paisesISOMapping" :continente="continente" :coluna="colunaSelecionada" v-model:pais-selecionado="paisSelecionado" :obter-programa="() => programaDaColuna(colunaSelecionada)" mostrar-comparar @comparar="abrirComparacao" @pais-atual="paisEmExecucao = $event"></mapa-panel>
            </div>
            <sala-config v-if="configurandoSala" modal :sala="sala" :total="totalRespostas" :regioes="paises" @carregar="carregarPlanilha" @csv="carregarCsv" @update:pergunta="escolherPerguntaSala" @fechar="configurandoSala = false"></sala-config>
            <comparar-panel v-if="comparando" :paises="paises" :paises-iso-mapping="paisesISOMapping" :continente="continente" :colunas="colunasComparaveis" :coluna-inicial="colunaSelecionada" :programa-da-coluna="programaDaColuna" @voltar="fecharComparacao"></comparar-panel>
        </template>
        <!-- Sala de aula ainda sem respostas: configuração em tela cheia -->
        <sala-config v-else-if="sala" :sala="sala" :total="totalRespostas" :regioes="paises" @carregar="carregarPlanilha" @csv="carregarCsv" @update:pergunta="escolherPerguntaSala" @fechar="comecarSala" @voltar="voltarAoInicio" @abrir-projeto="abrirProjetoNaConfiguracao"></sala-config>
        <div v-else class="carregando">
            <h2>⏳ Carregando...</h2>
        </div>
    </div>

    <!-- Componentes e App -->
    <script type="module">
        import BlocklyPanel from './src/components/BlocklyPanel.js';
        import { ORDENACAO_PADRAO, ordenarPaises, definirOrdemValores } from './src/utils/ordenacao.js';
        import { CONTINENTES, LISTA_CONTINENTES, arquivosDoContinente, continenteDaURL, urlDoContinente, termosDo } from './src/continentes.js';
        import { baixarCsvDaPlanilha, lerCsv, limparRespostas, perguntasDaTabela, detectarPerguntaPosicao, montarRegioes, isoDasRegioes, REGIOES_SALA, COLUNA_QUANTIDADE } from './src/sala.js';

        const { createApp } = Vue;

        // Componente: TelaInicial (escolha do continente). Os cartões são
        // links: abrir um continente recarrega a página com ?continente=id,
        // o que também serve de link direto para os alunos.
        const TelaInicial = {
            name: 'TelaInicial',
            data() {
                return { continentes: LISTA_CONTINENTES };
            },
            template: `
                <div class="tela-inicial">
                    <header class="tela-inicial-cabecalho">
                        <h1>Ferramenta de Regionalização</h1>
                        <p>Escolha o que você vai regionalizar</p>
                    </header>
                    <div class="continentes">
                        <component
                            v-for="c in continentes" :key="c.id"
                            :is="c.disponivel ? 'a' : 'div'"
                            :href="c.disponivel ? urlDo(c) : null"
                            class="continente-cartao"
                            :class="{ indisponivel: !c.disponivel }"
                            :aria-disabled="!c.disponivel"
                        >
                            <span class="continente-icone" aria-hidden="true">{{ c.icone }}</span>
                            <span class="continente-nome">{{ c.nome }}</span>
                            <span class="continente-descricao">{{ c.descricao }}</span>
                            <span v-if="!c.disponivel" class="continente-etiqueta">Em breve</span>
                        </component>
                    </div>
                    <footer class="tela-inicial-rodape">CLIC · Geografia</footer>
                </div>
            `,
            methods: {
                urlDo: urlDoContinente
            }
        };

        // Componente: DadosPanel
        const DadosPanel = {
            name: 'DadosPanel',
            // paises: já na ordem escolhida (o App ordena).
            // coluna: a coluna exibida na tabela. Fica no App (v-model)
            // porque também define qual workspace o BlocklyPanel mostra.
            // ordenacao: {por: 'País' | 'valor', direcao: 'asc' | 'desc'},
            // escolhida clicando nos cabeçalhos; também no App (v-model),
            // que lembra uma ordenação por coluna.
            // paisAtual: nome do país que o laço está visitando durante a
            // execução (null fora dela): a linha dele ganha destaque e a
            // tabela rola para mantê-la visível.
            // paisSelecionado: país clicado na tabela (o mapa dá zoom nele);
            // a linha fica marcada. Clicar emite selecionar-pais; o App
            // decide (alterna seleção e comanda o mapa)
            // termos: como chamar cada linha ("País" ou "Aluno"; veja
            // termosDo em src/continentes.js).
            // rotulosColunas: coluna -> nome mostrado no seletor "Visualizar
            // coluna", quando difere do nome da coluna (na sala, "Região").
            // Slot "acoes": botões extras no cabeçalho (os da sala de aula)
            props: ['paises', 'coluna', 'ordenacao', 'paisAtual', 'paisSelecionado', 'termos', 'rotulosColunas'],
            emits: ['largura', 'update:coluna', 'update:ordenacao', 'selecionar-pais'],
            watch: {
                // Ao trocar a coluna ou a ordenação (ou carregar os dados),
                // avisa o App a largura que a tabela precisa para o painel
                // se ajustar
                coluna: 'emitirLargura',
                ordenacao: 'emitirLargura',
                paises: 'emitirLargura',
                paisAtual: 'mostrarLinhaAtual'
            },
            mounted() {
                this.emitirLargura();
            },
            computed: {
                // Todas as colunas dos dados, exceto o nome do país e as
                // coordenadas do mapa (uso interno)
                colunas() {
                    if (!this.paises.length) return [];
                    return Object.keys(this.paises[0])
                        .filter(c => c !== 'País' && !c.startsWith('Coordenada'));
                },
                // Colunas numéricas são alinhadas à direita
                colunaNumerica() {
                    return this.paises.some(p => typeof p[this.coluna] === 'number');
                }
            },
            template: `
                <div class="panel dados-panel">
                    <div class="painel-cabecalho coluna-seletor">
                        <label for="coluna-select">Visualizar coluna:</label>
                        <select id="coluna-select" :value="coluna" @change="$emit('update:coluna', $event.target.value)">
                            <option v-for="coluna in colunas" :key="coluna" :value="coluna">
                                {{ (rotulosColunas && rotulosColunas[coluna]) || coluna }}
                            </option>
                        </select>
                        <slot name="acoes"></slot>
                    </div>
                    <div class="tabela-scroll">
                        <table class="dados-table" ref="tabela">
                            <thead>
                                <tr>
                                    <th class="ordenavel" :class="{ ativa: ordenacao.por === 'País' }" @click="ordenarPor('País')" :title="'Ordenar por nome: ' + termos.singular">
                                        {{ termos.titulo }} <span class="seta">{{ seta('País') }}</span>
                                    </th>
                                    <th class="ordenavel" :class="{ numerico: colunaNumerica, ativa: ordenacao.por === 'valor' }" @click="ordenarPor('valor')" title="Ordenar por esta coluna">
                                        {{ coluna }} <span class="seta">{{ seta('valor') }}</span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="pais in paises" :key="pais['País']" :class="{ executando: pais['País'] === paisAtual, selecionada: pais['País'] === paisSelecionado }" @click="$emit('selecionar-pais', pais['País'])" :title="'Clique para ver ' + termos.este + ' no mapa'">
                                    <td><strong>{{ pais['País'] }}</strong></td>
                                    <td :class="{ numerico: colunaNumerica }">{{ formatarValor(pais[coluna], coluna) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            methods: {
                // Clique no cabeçalho: se já ordena por ele, inverte a
                // direção; senão passa a ordenar por ele, crescente
                ordenarPor(por) {
                    const direcao = this.ordenacao.por === por && this.ordenacao.direcao === 'asc'
                        ? 'desc' : 'asc';
                    this.$emit('update:ordenacao', { por, direcao });
                },
                // Seta do cabeçalho: ▲/▼ no ativo, ⇅ apagado nos demais
                seta(por) {
                    if (this.ordenacao.por !== por) return '⇅';
                    return this.ordenacao.direcao === 'asc' ? '▲' : '▼';
                },
                // Rola a área da tabela o mínimo para a linha em execução
                // aparecer inteira, abaixo do cabeçalho fixo (sticky)
                mostrarLinhaAtual(nome) {
                    if (!nome) return;
                    this.$nextTick(() => {
                        const tabela = this.$refs.tabela;
                        const linha = tabela && tabela.querySelector('tr.executando');
                        if (!linha) return;
                        const area = tabela.parentElement;
                        const caixa = area.getBoundingClientRect();
                        const l = linha.getBoundingClientRect();
                        // Folga para a linha não ficar colada nas bordas
                        const folga = 12;
                        const topo = caixa.top + tabela.tHead.offsetHeight + folga;
                        const base = caixa.bottom - folga;
                        let delta = 0;
                        if (l.top < topo) delta = l.top - topo;
                        else if (l.bottom > base) delta = l.bottom - base;
                        if (delta) area.scrollBy({ top: delta, behavior: 'smooth' });
                    });
                },
                emitirLargura() {
                    this.$nextTick(() => {
                        const tabela = this.$refs.tabela;
                        if (!tabela) return;
                        // O padding fica na área de rolagem (.tabela-scroll), não no painel
                        const estilo = getComputedStyle(tabela.parentElement);
                        const padding = parseFloat(estilo.paddingLeft) + parseFloat(estilo.paddingRight);
                        // Folga para a barra de rolagem vertical do painel
                        this.$emit('largura', Math.ceil(tabela.offsetWidth + padding + 20));
                    });
                },
                formatarValor(valor, coluna) {
                    if (valor === null || valor === undefined) return '-';
                    if (typeof valor !== 'number') return valor;
                    // Formato brasileiro: vírgula decimal e ponto de milhar.
                    // Casas decimais por coluna (demais são inteiras); o PIB
                    // mostra até 3 casas para os países muito pequenos
                    // (Tuvalu: 0,065 bilhão) sem poluir os grandes (2.124,0)
                    const casas = { 'IDH': [3, 3], 'PIB (Bilhões de Dolares)': [1, 3]}[coluna] ?? [0, 0];
                    return valor.toLocaleString('pt-BR', {
                        minimumFractionDigits: casas[0], maximumFractionDigits: casas[1]
                    });
                }
            }
        };

        // Componente: SalaConfig. Liga a sala de aula à planilha de
        // respostas do Google Forms (ou a um CSV) e escolhe a pergunta com
        // a posição na sala. Em tela cheia ao abrir a sala (antes de ter
        // respostas) e como janela (modal) pelo botão "Planilha".
        // sala: estado do App ({link, carregando, erro, perguntas, pergunta,
        // avisos}). total: quantas respostas foram lidas; regioes: as linhas
        // da tabela (para o resumo de alunos por região).
        const SalaConfig = {
            name: 'SalaConfig',
            props: { sala: Object, total: Number, regioes: Array, modal: Boolean },
            emits: ['carregar', 'csv', 'update:pergunta', 'fechar', 'voltar', 'abrir-projeto'],
            data() {
                return { link: this.sala.link, COLUNA_QUANTIDADE };
            },
            template: `
                <div :class="modal ? 'sala-config-fundo' : 'sala-config-tela'" @click.self="modal && $emit('fechar')">
                    <div class="sala-config" role="dialog" aria-labelledby="sala-config-titulo">
                        <h1 id="sala-config-titulo">🏫 Regionalização da sala de aula</h1>
                        <ol class="sala-config-passos">
                            <li>Crie um <strong>Google Forms</strong> com a pergunta <em>“Onde você está sentado?”</em> em <strong>grade de múltipla escolha</strong>: linhas Frente, Centro e Fundo; colunas Esquerda e Direita. Acrescente perguntas com números sobre a sala (quantas canetas no estojo…).</li>
                            <li>Na aba <strong>Respostas</strong> do formulário, clique em <strong>Vincular ao Planilhas</strong>.</li>
                            <li>Na planilha, clique em <strong>Compartilhar</strong> e escolha <strong>“Qualquer pessoa com o link”</strong> (leitor).</li>
                            <li>Copie o link da planilha e cole aqui:</li>
                        </ol>
                        <form class="sala-config-link" @submit.prevent="$emit('carregar', link)">
                            <input type="url" v-model.trim="link" placeholder="https://docs.google.com/spreadsheets/d/..." aria-label="Link da planilha de respostas" required>
                            <button type="submit" class="btn-cheio" :disabled="sala.carregando || !link">{{ sala.carregando ? '⏳ Lendo…' : 'Ler respostas' }}</button>
                        </form>
                        <p class="sala-config-alternativa">
                            ou <button type="button" class="btn-link" @click="$refs.csv.click()">envie um arquivo CSV</button>
                            <input type="file" accept=".csv,text/csv" ref="csv" hidden @change="lerArquivo($event, 'csv')">
                            <template v-if="!modal">
                                · <button type="button" class="btn-link" @click="$refs.projeto.click()">abra um projeto salvo</button>
                                <input type="file" accept=".json,application/json" ref="projeto" hidden @change="lerArquivo($event, 'projeto')">
                            </template>
                        </p>
                        <p v-if="sala.erro" class="sala-config-erro" role="alert">{{ sala.erro }}</p>

                        <div v-if="total" class="sala-config-coluna">
                            <p><strong>{{ total }} {{ total === 1 ? 'resposta lida' : 'respostas lidas' }}.</strong></p>
                            <label class="coluna-seletor">
                                <span>Pergunta com a posição na sala:</span>
                                <select :value="sala.pergunta || ''" @change="$emit('update:pergunta', $event.target.value || null)">
                                    <option value="">(nenhuma)</option>
                                    <option v-for="p in sala.perguntas" :key="p" :value="p">{{ p }}</option>
                                </select>
                            </label>
                            <p v-if="!sala.pergunta" class="sala-config-erro">Não encontrei a pergunta com a posição (frente, centro ou fundo; esquerda ou direita). Escolha a pergunta acima; sem ela, as regiões ficam vazias.</p>
                            <template v-else>
                                <table class="sala-config-resumo">
                                    <tr v-for="r in regioes" :key="r['País']">
                                        <td>{{ r['País'] }}</td>
                                        <td><strong>{{ r[COLUNA_QUANTIDADE] }}</strong> {{ r[COLUNA_QUANTIDADE] === 1 ? 'aluno' : 'alunos' }}</td>
                                    </tr>
                                </table>
                                <p v-if="sala.avisos.varias" class="sala-config-aviso">⚠️ {{ sala.avisos.varias }} {{ sala.avisos.varias === 1 ? 'resposta marcou' : 'respostas marcaram' }} mais de um lugar: contei só o primeiro. Para evitar isso, use <strong>grade de múltipla escolha</strong> (e não de caixas de seleção).</p>
                                <p v-if="sala.avisos.semPosicao" class="sala-config-aviso">⚠️ {{ sala.avisos.semPosicao }} {{ sala.avisos.semPosicao === 1 ? 'resposta não diz' : 'respostas não dizem' }} onde o aluno senta e {{ sala.avisos.semPosicao === 1 ? 'ficou' : 'ficaram' }} fora das regiões.</p>
                            </template>
                        </div>

                        <div class="sala-config-rodape">
                            <button v-if="!modal" type="button" class="btn-contorno" @click="$emit('voltar')">← Voltar</button>
                            <button v-if="total" type="button" class="btn-cheio" @click="$emit('fechar')">{{ modal ? 'Fechar' : 'Começar →' }}</button>
                        </div>
                    </div>
                </div>
            `,
            methods: {
                async lerArquivo(event, tipo) {
                    const arquivo = event.target.files[0];
                    // Permite escolher o mesmo arquivo de novo depois
                    event.target.value = '';
                    if (!arquivo) return;
                    const texto = await arquivo.text();
                    if (tipo === 'csv') {
                        this.$emit('csv', texto);
                        return;
                    }
                    try {
                        this.$emit('abrir-projeto', JSON.parse(texto));
                    } catch (error) {
                        alert('Não foi possível ler o arquivo: não é um JSON válido.');
                    }
                }
            }
        };

        // Último link de planilha usado na sala de aula, para não precisar
        // colar de novo ao recarregar a página (só neste navegador)
        const CHAVE_LINK_SALA = 'clic-regionalizacao-link-sala';
        function lerLinkSala() {
            try { return localStorage.getItem(CHAVE_LINK_SALA) || ''; } catch (error) { return ''; }
        }
        function guardarLinkSala(link) {
            try { localStorage.setItem(CHAVE_LINK_SALA, link); } catch (error) { /* sem armazenamento */ }
        }

        // Cinza dos países ainda não pintados (fill original dos SVGs)
        const COR_PADRAO_PAIS = '#787878';
        // Limites do zoom do mapa (roda, pinça e foco num país). 12x é o
        // bastante para as ilhas pequenas do Caribe e da Oceania
        const ESCALA_MIN = 0.5;
        const ESCALA_MAX = 12;

        // Identificação do arquivo de projeto (.json): formato e versão,
        // para recusar arquivos de outra origem ou de versões futuras.
        // Versão 2: passou a gravar o continente (a 1 era só a América).
        const PROJETO_FORMATO = 'clic-regionalizacao';
        const PROJETO_VERSAO = 2;
        // Projeto de outro continente guardado enquanto a página recarrega
        // com o continente certo (veja abrirProjeto)
        const CHAVE_PROJETO_PENDENTE = 'clic-regionalizacao-projeto-pendente';

        // Componente: MapaPanel
        const MapaPanel = {
            name: 'MapaPanel',
            // continente: entrada de src/continentes.js (arquivo do mapa,
            // territórios a ocultar e ajustes do SVG).
            // obterPrograma: função que devolve o programa a rodar no botão
            // "Executar" ({codigo, legenda, colunas, paises}, ou null se não
            // há blocos). Quem decide qual coluna é o pai (veja rodar).
            // mostrarComparar: exibe o botão de comparar regionalizações
            // (só no mapa principal; na comparação ele não faz sentido).
            // coluna: coluna em exibição na tabela, mostrada no tooltip.
            // paisSelecionado (v-model): país clicado na tabela; ganha um
            // contorno e um tooltip fixo. O zoom até ele é comandado pelo
            // App (focarPais/resetZoom); clicar no mapa ou resetar o zoom
            // desfaz a seleção (update:paisSelecionado null).
            props: {
                paises: Array,
                paisesIsoMapping: Object,
                continente: Object,
                obterPrograma: Function,
                mostrarComparar: Boolean,
                coluna: String,
                paisSelecionado: String
            },
            // pais-atual: nome do país que o laço está visitando (null ao
            // terminar ou parar), para a tabela destacar a linha dele
            emits: ['comparar', 'pais-atual', 'update:paisSelecionado'],
            data() {
                return {
                    svgContent: '',
                    // Id da execução em andamento: cada laço guarda o id
                    // com que começou e para quando ele muda (pararExecucao)
                    execucaoId: 0,
                    // Há um laço rodando (o botão vira "Pausar") / ele está
                    // pausado pelo botão (vira "Continuar"). retomar: função
                    // que acorda o laço pausado (veja esperar)
                    executando: false,
                    pausado: false,
                    retomar: null,
                    // "Próximo país" apertado enquanto o laço ainda dormia
                    // o intervalo: ao acordar ele avança um país sem parar
                    passoPendente: false,
                    // Controles de zoom e pan
                    scale: 1,
                    translateX: 0,
                    translateY: 0,
                    isPanning: false,
                    // Voo animado até um país (focarPais) ou de volta ao
                    // mapa inteiro: transição mais longa no transform
                    animando: false,
                    temporizadorVoo: null,
                    startPanX: 0,
                    startPanY: 0,
                    // Ponteiros (mouse, dedos, caneta) apoiados no mapa:
                    // id -> {x, y}. Um ponteiro arrasta; dois fazem pinça.
                    ponteiros: new Map(),
                    // Se o gesto atual chegou a mover o mapa: um toque que
                    // não move é um "tap" (tooltip / duplo toque)
                    gestoMoveu: false,
                    ultimoToque: null,
                    // Velocidade da pintura (1 = lento ... 10 = rápido)
                    velocidade: 9,
                    // Itens {cor, rotulo, detalhe} montados pelo
                    // BlocklyPanel a partir dos blocos, ao executar
                    legenda: [],
                    // Colunas usadas nos blocos "se" da última execução;
                    // aparecem no tooltip de cada país
                    colunasVisualizadas: [],
                    // Tooltip do país sob o mouse: { nome, atributos: [{rotulo, valor}], x, y }
                    tooltip: null
                };
            },
            computed: {
                // Código ISO (id no SVG) -> registro do país, para o tooltip
                paisPorISO() {
                    const porNome = Object.fromEntries((this.paises || []).map(p => [p['País'], p]));
                    const mapa = {};
                    for (const [nome, iso] of Object.entries(this.paisesIsoMapping || {})) {
                        mapa[iso] = porNome[nome] || { 'País': nome };
                    }
                    return mapa;
                },
                // Pausa entre países em ms: 1000ms (lento) ... 100ms (rápido)
                intervaloMs() {
                    return (11 - this.velocidade) * 100;
                },
                rotuloExecutar() {
                    if (this.pausado) return 'Continuar';
                    return this.executando ? 'Pausar' : 'Executar';
                },
                iconeExecutar() {
                    return this.executando && !this.pausado ? '⏸️' : '▶️';
                },
                termos() {
                    return termosDo(this.continente);
                }
            },
            template: `
                <div class="panel mapa-panel">
                    <div class="mapa-botoes">
                        <!-- Botões só com ícone: o nome fica no title e no aria-label -->
                        <button class="execute-btn" :class="{ pausar: executando && !pausado }" @click="executar" :title="rotuloExecutar + (executando && !pausado ? ': pausa a pintura; clique de novo para continuar' : ': roda os blocos e pinta o mapa')" :aria-label="rotuloExecutar">{{ iconeExecutar }}</button>
                        <button class="passo-btn" @click="passo" :title="termos.proximo + ': executa os blocos para ' + termos.um + ' por vez e pausa'" :aria-label="termos.proximo">⏭️</button>
                        <button class="reset-btn" @click="resetarMapa" title="Parar / Resetar: para a execução e limpa o mapa" aria-label="Parar / Resetar">⏹️</button>
                        <label class="velocidade-ctrl" title="Velocidade da pintura">
                            <span>🐢</span>
                            <input type="range" min="1" max="10" step="1" v-model.number="velocidade">
                            <span>🐇</span>
                            <span class="velocidade-valor">{{ intervaloMs }} ms</span>
                        </label>
                        <button v-if="mostrarComparar" class="btn-contorno btn-comparar" @click="$emit('comparar')" title="Abre dois mapas lado a lado para comparar regionalizações">⚖️ Comparar</button>
                    </div>
                    <div class="mapa-area" ref="area">
                        <div
                            class="mapa-container"
                            @wheel.prevent="handleWheel"
                            @dblclick="resetZoom"
                            @pointerdown="onPointerDown"
                            @pointermove="onPointerMove"
                            @pointerup="onPointerUp"
                            @pointercancel="onPointerUp"
                            @pointerleave="onPointerLeave"
                            :style="{ cursor: isPanning ? 'grabbing' : 'grab' }"
                        >
                            <div
                                v-html="svgContent"
                                class="mapa-svg"
                                :style="{ transform: 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')', transformOrigin: 'center center', transition: isPanning ? 'none' : animando ? 'transform 0.5s ease-in-out' : 'transform 0.1s ease-out' }"
                            ></div>
                        </div>
                        <div class="mapa-tooltip" v-if="tooltip" :class="{ 'a-esquerda': tooltip.aEsquerda }" :style="{ left: tooltip.x + 'px', top: tooltip.y + 'px' }">
                            <div class="mapa-tooltip-nome">{{ tooltip.nome }}</div>
                            <div class="mapa-tooltip-atributo" v-for="a in tooltip.atributos" :key="a.rotulo">
                                <span class="mapa-tooltip-rotulo">{{ a.rotulo }}:</span> {{ a.valor }}
                            </div>
                        </div>
                        <div class="mapa-legenda" v-if="legenda.length">
                            <div class="mapa-legenda-titulo">Legenda</div>
                            <div class="mapa-legenda-item" v-for="item in legenda" :key="item.cor + item.rotulo" :title="item.detalhe || item.rotulo">
                                <span class="mapa-legenda-cor" :style="{ backgroundColor: item.cor }"></span>
                                <span class="mapa-legenda-rotulo">{{ item.rotulo }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            async mounted() {
                await this.carregarMapa();
            },
            beforeUnmount() {
                // Um laço em andamento continuaria rodando sem mapa
                this.pararExecucao();
            },
            watch: {
                // O mapeamento chega depois do mounted (fetch no componente raiz),
                // entao refazemos o recorte quando ele finalmente carrega.
                paisesIsoMapping() {
                    if (this.svgContent) this.ajustarViewBox();
                },
                paisSelecionado(nome) {
                    this.marcarSelecionado(nome);
                    // Em voo o tooltip abre ao chegar (veja voarPara)
                    if (!this.animando) this.atualizarTooltipSelecao();
                },
                // O contorno da seleção tem espessura fixa na tela
                scale() {
                    this.ajustarContorno();
                },
                // A coluna da tabela aparece no tooltip fixo
                coluna() {
                    this.atualizarTooltipSelecao();
                }
            },
            methods: {
                // Botão Executar / Pausar / Continuar
                executar() {
                    if (this.pausado) {
                        this.continuar();
                        return;
                    }
                    if (this.executando) {
                        this.pausado = true;
                        return;
                    }
                    const programa = this.obterProgramaOuAvisar();
                    if (programa) this.rodar(programa);
                },
                // Botão "Próximo país": avança um país e fica pausado.
                // Parado: começa a execução já pausada no primeiro país.
                // Rodando: só pausa (o próximo clique avança).
                // Pausado: acorda o laço para um país e ele pausa de novo.
                passo() {
                    if (!this.executando) {
                        const programa = this.obterProgramaOuAvisar();
                        if (!programa) return;
                        this.rodar(programa);
                        // O laço já pintou o primeiro país (a parte síncrona
                        // de rodar) e está dormindo o intervalo; ao acordar
                        // vê a pausa e espera
                        this.pausado = true;
                        return;
                    }
                    if (!this.pausado) {
                        this.pausado = true;
                        return;
                    }
                    if (this.retomar) {
                        this.acordar();
                    } else {
                        this.passoPendente = true;
                    }
                },
                // O código é gerado pelo BlocklyPanel (via obterPrograma)
                obterProgramaOuAvisar() {
                    const programa = this.obterPrograma ? this.obterPrograma() : null;
                    if (!programa) console.log('⚠️ Nenhum código para executar');
                    return programa;
                },
                // Roda um programa neste mapa. codigo: função assíncrona
                // gerada pelo BlocklyPanel (iniciar_programa) que recebe o
                // contexto do mapa: a lista de países na ordem da pintura,
                // o pintarPais, a pausa entre países (slider, lida a cada
                // país) e o id da execução (para o laço parar ao resetar).
                rodar({ codigo, legenda, colunas, paises }) {
                    // Encerra uma execução anterior ainda em andamento e
                    // limpa o mapa, para a nova varredura começar do zero
                    this.resetarMapa();
                    this.legenda = legenda;
                    this.colunasVisualizadas = colunas;
                    this.executando = true;

                    const painel = this;
                    const idDesta = this.execucaoId;
                    const mapa = {
                        paises,
                        pintarPais: (nome, cor) => this.pintarPais(nome, cor),
                        visitar: (pais) => this.$emit('pais-atual', pais['País']),
                        esperar: () => this.esperar(),
                        get execucaoId() { return painel.execucaoId; }
                    };
                    // Ao terminar, tira o destaque da tabela e volta o botão
                    // a "Executar", a não ser que outra execução já tenha
                    // começado (aí o estado é dela)
                    const terminou = () => {
                        if (this.execucaoId !== idDesta) return;
                        this.executando = false;
                        this.pausado = false;
                        this.$emit('pais-atual', null);
                    };
                    try {
                        const programa = new Function(`return ${codigo}`)();
                        // O laço é assíncrono (pausa entre países), então
                        // erros dentro dele chegam pela Promise
                        Promise.resolve(programa(mapa))
                            .then(() => console.log('✅ Executado!'))
                            .catch(error => {
                                console.error('❌ Erro:', error);
                                alert('Erro ao executar: ' + error.message);
                            })
                            .finally(terminou);
                    } catch (error) {
                        console.error('❌ Erro:', error);
                        alert('Erro ao executar: ' + error.message);
                    }
                },
                // Espera entre um país e o próximo: a pausa do slider de
                // velocidade (não quando avança país a país) e, se o aluno
                // apertou "Pausar", até ele apertar "Continuar" ou "Próximo
                // país" (ou parar/resetar, que também acorda o laço: ele
                // então vê que o id mudou e encerra)
                async esperar() {
                    if (!this.pausado) {
                        await new Promise(r => setTimeout(r, this.intervaloMs));
                    }
                    if (this.pausado && !this.passoPendente) {
                        await new Promise(r => { this.retomar = r; });
                    }
                    this.passoPendente = false;
                },
                // Acorda o laço parado em esperar (a pausa continua como está)
                acordar() {
                    const retomar = this.retomar;
                    this.retomar = null;
                    if (retomar) retomar();
                },
                continuar() {
                    this.pausado = false;
                    this.passoPendente = false;
                    this.acordar();
                },
                // Cancela o laço em andamento (veja execucaoId)
                pararExecucao() {
                    this.execucaoId++;
                    this.executando = false;
                    this.continuar();
                    this.$emit('pais-atual', null);
                },
                async carregarMapa() {
                    try {
                        const response = await fetch(arquivosDoContinente(this.continente).mapa);
                        this.svgContent = await response.text();
                        await this.$nextTick();
                        this.ocultarForaDoContinente();
                        const svg = this.$el.querySelector('svg');
                        if (svg && this.continente.prepararMapa) this.continente.prepararMapa(svg);
                        this.ajustarViewBox();
                        console.log('✅ Mapa carregado');
                    } catch (error) {
                        console.error('❌ Erro ao carregar mapa:', error);
                    }
                },
                // Zoom multiplicativo e proporcional ao giro: um dente da
                // roda do mouse (deltaY ~100) amplia ~22%, em qualquer escala;
                // o trackpad manda muitos deltas pequenos, então fica suave.
                // O delta é limitado para um giro forte não dar um salto.
                handleWheel(event) {
                    const delta = Math.max(-200, Math.min(200, event.deltaY));
                    const fator = Math.exp(-delta * 0.002);
                    this.aplicarZoom(this.scale * fator, event.clientX, event.clientY);
                    this.atualizarTooltipSelecao();
                },
                // Zoom ancorado no ponto (clientX, clientY): o ponto do mapa
                // que está ali continua ali depois da mudança de escala.
                // O transform é translate(t) scale(s) com origem no centro C
                // do container, então um ponto p do mapa vai parar em
                // C + t + s*(p - C). Mantendo M = C + t + s*(p - C) para a
                // nova escala s', a translação vira
                // t' = (M - C) - (s'/s) * (M - C - t).
                aplicarZoom(escala, clientX, clientY) {
                    const novaEscala = Math.max(ESCALA_MIN, Math.min(ESCALA_MAX, escala));
                    if (novaEscala === this.scale) return;
                    const caixa = this.$refs.area.getBoundingClientRect();
                    const mx = clientX - caixa.left - caixa.width / 2;
                    const my = clientY - caixa.top - caixa.height / 2;
                    const razao = novaEscala / this.scale;
                    this.translateX = mx - razao * (mx - this.translateX);
                    this.translateY = my - razao * (my - this.translateY);
                    this.scale = novaEscala;
                },
                // Remove do mapa os territórios listados em continente.ocultar
                // (os arquivos de origem são mapas-múndi recortados, então
                // ainda trazem terras que não fazem parte do continente)
                ocultarForaDoContinente() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    for (const codigoISO of this.continente.ocultar || []) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (elemento) elemento.remove();
                    }
                },
                // O viewBox do arquivo costuma ser bem maior que o desenho do
                // continente, o que deixava muita área vazia em volta. Aqui
                // medimos a caixa real dos países e recortamos o viewBox nela.
                ajustarViewBox() {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    // Na sala o recorte é o desenho inteiro (com a lousa)
                    const bbox = (!this.continente.recorteCompleto && this.medirPaises(svg)) || this.medirTudo(svg);
                    if (!bbox) return;

                    // Margem pequena para o traco das bordas nao ficar cortado
                    // (a sala pede uma margem maior: continente.margemRecorte)
                    const margem = Math.max(bbox.width, bbox.height) * (this.continente.margemRecorte ?? 0.02);
                    const x = bbox.x - margem;
                    const y = bbox.y - margem;
                    const largura = bbox.width + margem * 2;
                    const altura = bbox.height + margem * 2;

                    svg.setAttribute('viewBox', `${x} ${y} ${largura} ${altura}`);
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    // Fronteiras com a mesma espessura visual em qualquer mapa
                    // (a referência é a largura do mapa das Américas)
                    svg.style.setProperty('--traco', (largura / 750).toFixed(3));
                    // Sem width/height fixos o SVG passa a ocupar o painel inteiro
                    // seguindo a proporcao do novo viewBox.
                    svg.removeAttribute('width');
                    svg.removeAttribute('height');
                },
                // Medimos só os países da base: o arquivo pode trazer territórios
                // distantes (na América: Ilhas Cook, Kiribati, Polinésia Francesa,
                // Antártida...) que esticariam a caixa.
                medirPaises(svg) {
                    // getBBox() devolve coordenadas no espaco local do elemento e
                    // varios grupos deste SVG tem transform="matrix(2.19...)". Por
                    // isso convertemos cada caixa para o espaco da raiz via CTM.
                    const ctmRaiz = svg.getScreenCTM();
                    if (!ctmRaiz) return null;
                    const paraRaiz = ctmRaiz.inverse();

                    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;

                    for (const codigoISO of Object.values(this.paisesIsoMapping || {})) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (!elemento) continue;

                        let caixa, ctm;
                        try {
                            caixa = elemento.getBBox();
                            ctm = elemento.getScreenCTM();
                        } catch (error) {
                            continue;
                        }
                        if (!ctm || (!caixa.width && !caixa.height)) continue;

                        const m = paraRaiz.multiply(ctm);
                        const cantos = [
                            [caixa.x, caixa.y],
                            [caixa.x + caixa.width, caixa.y],
                            [caixa.x, caixa.y + caixa.height],
                            [caixa.x + caixa.width, caixa.y + caixa.height]
                        ];

                        for (const [cx, cy] of cantos) {
                            const ponto = svg.createSVGPoint();
                            ponto.x = cx;
                            ponto.y = cy;
                            const p = ponto.matrixTransform(m);
                            x1 = Math.min(x1, p.x);
                            y1 = Math.min(y1, p.y);
                            x2 = Math.max(x2, p.x);
                            y2 = Math.max(y2, p.y);
                        }
                    }

                    if (!Number.isFinite(x1)) return null;

                    return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
                },
                medirTudo(svg) {
                    try {
                        const caixa = svg.getBBox();
                        return caixa.width && caixa.height ? caixa : null;
                    } catch (error) {
                        console.warn('⚠️ Nao foi possivel medir o mapa:', error);
                        return null;
                    }
                },
                // Volta ao mapa inteiro (duplo clique/toque, ou desselecionar
                // na tabela) e desfaz a seleção
                resetZoom() {
                    this.voarPara(1, 0, 0);
                    this.$emit('update:paisSelecionado', null);
                },
                // Centraliza o país e amplia até ele ocupar ~metade da área
                // (com o teto ESCALA_MAX: ilhas pequenas ficam visíveis sem
                // perder os vizinhos). O centro do país na tela é
                // C + t + s*p (veja aplicarZoom); daí tiramos o ponto p do
                // mapa e escolhemos t' = -s'*p para ele cair no centro C.
                focarPais(nome) {
                    const elemento = this.elementoDoPais(nome);
                    if (!elemento) return;
                    const caixa = this.$refs.area.getBoundingClientRect();
                    const r = elemento.getBoundingClientRect();
                    if (!r.width && !r.height) return;
                    const px = (r.left + r.width / 2 - caixa.left - caixa.width / 2 - this.translateX) / this.scale;
                    const py = (r.top + r.height / 2 - caixa.top - caixa.height / 2 - this.translateY) / this.scale;
                    // Tamanho do país sem zoom
                    const largura = r.width / this.scale;
                    const altura = r.height / this.scale;
                    // Nunca menos que o mapa inteiro (países grandes como o
                    // Canadá só são centralizados)
                    const escala = Math.max(1, Math.min(ESCALA_MAX,
                        0.5 * Math.min(caixa.width / largura, caixa.height / altura)));
                    this.voarPara(escala, -escala * px, -escala * py);
                },
                // Vai animado até a escala/translação dadas; ao chegar,
                // abre o tooltip do país selecionado (se houver)
                voarPara(escala, translateX, translateY) {
                    clearTimeout(this.temporizadorVoo);
                    this.animando = true;
                    this.tooltip = null;
                    this.scale = escala;
                    this.translateX = translateX;
                    this.translateY = translateY;
                    this.temporizadorVoo = setTimeout(() => {
                        this.animando = false;
                        this.atualizarTooltipSelecao();
                    }, 550);
                },
                // Elemento do SVG de um país (pelo nome nos dados)
                elementoDoPais(nome) {
                    const codigoISO = this.paisesIsoMapping[nome];
                    const svg = this.$el.querySelector('svg');
                    return codigoISO && svg ? svg.querySelector(`#${codigoISO}`) : null;
                },
                // Contorno coral no país selecionado: uma cópia do elemento
                // dele (só traço, sem preenchimento) num grupo no fim do
                // SVG, por cima de tudo. Os paths do arquivo têm stroke
                // inline, então mudar o traço do próprio país não daria
                // certo; a cópia também deixa a espessura independente das
                // fronteiras. O grupo recebe a matriz do elemento até a raiz
                // do SVG (transforms dos grupos acima e o dele próprio, como
                // em medirPaises), para a cópia cair exatamente sobre o
                // original.
                marcarSelecionado(nome) {
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;
                    svg.querySelector('.contorno-selecao')?.remove();
                    const elemento = this.elementoDoPais(nome);
                    if (!elemento) return;
                    const ctmRaiz = svg.getScreenCTM();
                    const ctm = elemento.getScreenCTM();
                    if (!ctmRaiz || !ctm) return;
                    const m = ctmRaiz.inverse().multiply(ctm);
                    const grupo = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    grupo.classList.add('contorno-selecao');
                    grupo.setAttribute('transform', `matrix(${m.a} ${m.b} ${m.c} ${m.d} ${m.e} ${m.f})`);
                    const copia = elemento.cloneNode(true);
                    copia.removeAttribute('id');
                    copia.removeAttribute('transform');
                    copia.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
                    grupo.appendChild(copia);
                    svg.appendChild(grupo);
                    this.ajustarContorno();
                },
                // Espessura do contorno em unidades do país para dar ~3px na
                // tela em qualquer zoom: px por unidade do SVG (encaixe
                // "meet" do viewBox) x zoom x escala da matriz do grupo
                ajustarContorno() {
                    const svg = this.$el.querySelector('svg');
                    const grupo = svg && svg.querySelector('.contorno-selecao');
                    if (!grupo) return;
                    const vb = svg.viewBox.baseVal;
                    const pxPorUnidade = Math.min(svg.clientWidth / vb.width, svg.clientHeight / vb.height);
                    const m = grupo.transform.baseVal.consolidate().matrix;
                    const largura = 3 / (pxPorUnidade * this.scale * Math.hypot(m.a, m.b));
                    grupo.style.setProperty('--contorno', largura);
                },
                // Pan e pinça com Pointer Events, que cobrem mouse, dedo e
                // caneta. O .mapa-container tem touch-action: none no CSS;
                // sem isso o iPad rolaria/ampliaria a página em vez de
                // entregar os movimentos ao mapa.
                onPointerDown(event) {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    // x0/y0: onde o ponteiro começou, para distinguir tap de arrasto
                    this.ponteiros.set(event.pointerId, { x: event.clientX, y: event.clientY, x0: event.clientX, y0: event.clientY });
                    if (this.ponteiros.size === 1) {
                        this.gestoMoveu = false;
                        this.iniciarPan(event.clientX, event.clientY);
                    }
                    this.isPanning = true;
                    this.tooltip = null;
                },
                iniciarPan(x, y) {
                    this.startPanX = x - this.translateX;
                    this.startPanY = y - this.translateY;
                },
                onPointerMove(event) {
                    const ponteiro = this.ponteiros.get(event.pointerId);
                    if (!ponteiro) {
                        // Mouse passeando sem botão apertado
                        if (event.pointerType === 'mouse') this.atualizarTooltip(event);
                        return;
                    }
                    if (this.ponteiros.size >= 2) {
                        this.moverPinca(ponteiro, event);
                    } else {
                        ponteiro.x = event.clientX;
                        ponteiro.y = event.clientY;
                        this.translateX = event.clientX - this.startPanX;
                        this.translateY = event.clientY - this.startPanY;
                    }
                    // Tolerância para o tremor do dedo num toque parado
                    if (this.ponteiros.size >= 2 || Math.hypot(event.clientX - ponteiro.x0, event.clientY - ponteiro.y0) > 8) {
                        this.gestoMoveu = true;
                    }
                },
                // Pinça: os dois primeiros dedos definem uma distância e um
                // ponto médio. A escala muda pela razão das distâncias,
                // ancorada no ponto médio antigo, e o mapa acompanha o
                // deslocamento do ponto médio.
                moverPinca(ponteiro, event) {
                    const [a, b] = [...this.ponteiros.values()];
                    const distAntes = Math.hypot(a.x - b.x, a.y - b.y);
                    const medioAntes = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    ponteiro.x = event.clientX;
                    ponteiro.y = event.clientY;
                    const distDepois = Math.hypot(a.x - b.x, a.y - b.y);
                    const medioDepois = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    if (distAntes > 0 && distDepois > 0) {
                        this.aplicarZoom(this.scale * distDepois / distAntes, medioAntes.x, medioAntes.y);
                    }
                    this.translateX += medioDepois.x - medioAntes.x;
                    this.translateY += medioDepois.y - medioAntes.y;
                },
                onPointerUp(event) {
                    if (!this.ponteiros.delete(event.pointerId)) return;
                    if (this.ponteiros.size === 1) {
                        // Da pinça para o arrasto: recomeça do dedo que ficou
                        const [restante] = this.ponteiros.values();
                        this.iniciarPan(restante.x, restante.y);
                    } else if (this.ponteiros.size === 0) {
                        this.isPanning = false;
                        if (event.pointerType !== 'mouse' && !this.gestoMoveu && event.type === 'pointerup') {
                            this.tratarToque(event);
                        } else if (!this.gestoMoveu && event.type === 'pointerup') {
                            // Clique do mouse sem arrastar: desfaz a seleção
                            // (o zoom fica onde está)
                            this.$emit('update:paisSelecionado', null);
                        } else {
                            this.atualizarTooltipSelecao();
                        }
                    }
                },
                onPointerLeave(event) {
                    // Só o mouse "sai" do mapa no meio do gesto; para o dedo
                    // o pointerleave vem depois do pointerup, já tratado
                    if (event.pointerType !== 'mouse') return;
                    this.ponteiros.delete(event.pointerId);
                    if (this.ponteiros.size === 0) this.isPanning = false;
                    this.atualizarTooltipSelecao();
                },
                // Toque sem arrastar: duplo toque reseta o zoom; toque num
                // país mostra o tooltip dele (no lugar do hover do mouse)
                tratarToque(event) {
                    const agora = Date.now();
                    const anterior = this.ultimoToque;
                    this.ultimoToque = { x: event.clientX, y: event.clientY, t: agora };
                    if (anterior && agora - anterior.t < 350
                        && Math.hypot(event.clientX - anterior.x, event.clientY - anterior.y) < 30) {
                        this.ultimoToque = null;
                        this.resetZoom();
                        return;
                    }
                    // Toque simples desfaz a seleção da tabela
                    this.$emit('update:paisSelecionado', null);
                    // Com o dedo o event.target é onde o toque começou;
                    // o elemento sob o ponto final é mais confiável
                    const alvo = document.elementFromPoint(event.clientX, event.clientY);
                    this.mostrarTooltip(this.paisSobMouse(alvo), event.clientX, event.clientY);
                },
                // Sobe do elemento sob o mouse até achar um id que seja código
                // ISO de país (os países do SVG têm sub-paths sem id útil)
                paisSobMouse(alvo) {
                    for (let el = alvo; el && el !== this.$el; el = el.parentElement) {
                        if (el.id && this.paisPorISO[el.id]) return this.paisPorISO[el.id];
                    }
                    return null;
                },
                atualizarTooltip(event) {
                    if (this.isPanning) { this.tooltip = null; return; }
                    this.mostrarTooltip(this.paisSobMouse(event.target), event.clientX, event.clientY);
                },
                // Sem país sob o mouse, volta o tooltip fixo da seleção
                mostrarTooltip(pais, clientX, clientY) {
                    this.tooltip = pais ? this.montarTooltip(pais, clientX, clientY) : this.tooltipSelecao();
                },
                montarTooltip(pais, clientX, clientY) {
                    // o tooltip e posicionado dentro de .mapa-area (nao do painel)
                    const caixa = this.$refs.area.getBoundingClientRect();
                    // A coluna da tabela e as colunas dos blocos executados,
                    // na ordem das colunas dos dados
                    const colunas = [this.coluna, ...this.colunasVisualizadas];
                    return {
                        nome: pais['País'],
                        atributos: Object.keys(pais)
                            .filter(c => colunas.includes(c))
                            .map(c => ({ rotulo: c, valor: pais[c] ?? '-' })),
                        x: clientX - caixa.left,
                        y: clientY - caixa.top,
                        // Na metade direita do painel o tooltip abre para a
                        // esquerda do cursor, senão seria cortado pela borda
                        aEsquerda: clientX - caixa.left > caixa.width / 2
                    };
                },
                // Tooltip fixo do país selecionado, no centro dele na tela
                // (null se não há seleção ou o país saiu da área visível)
                tooltipSelecao() {
                    if (!this.paisSelecionado) return null;
                    const elemento = this.elementoDoPais(this.paisSelecionado);
                    const pais = elemento && this.paisPorISO[elemento.id];
                    if (!pais) return null;
                    const r = elemento.getBoundingClientRect();
                    const caixa = this.$refs.area.getBoundingClientRect();
                    const x = r.left + r.width / 2;
                    const y = r.top + r.height / 2;
                    if (x < caixa.left || x > caixa.right || y < caixa.top || y > caixa.bottom) return null;
                    return this.montarTooltip(pais, x, y);
                },
                atualizarTooltipSelecao() {
                    if (this.isPanning) return;
                    this.tooltip = this.tooltipSelecao();
                },
                resetarMapa() {
                    // Para o laço em andamento, senão ele continuaria
                    // pintando por cima do mapa recém-limpo
                    this.pararExecucao();
                    this.legenda = [];
                    this.colunasVisualizadas = [];

                    // Devolve a cor original (cinza) a todos os paises mapeados
                    const corPadrao = this.continente.corPadrao || COR_PADRAO_PAIS;
                    const svg = this.$el.querySelector('svg');
                    if (!svg) return;

                    // Ao pintar, a cor faz um fade (transition de fill no CSS);
                    // no reset a volta ao cinza deve ser imediata. A classe
                    // desliga a transition e o getBoundingClientRect força o
                    // navegador a aplicar isso antes das mudanças de fill;
                    // sem ele, a classe e o fill cairiam no mesmo repaint e
                    // o fade aconteceria mesmo assim.
                    const mapa = svg.parentElement;
                    mapa.classList.add('sem-transicao');
                    svg.getBoundingClientRect();

                    for (const codigoISO of Object.values(this.paisesIsoMapping || {})) {
                        const elemento = svg.querySelector(`#${codigoISO}`);
                        if (!elemento) continue;

                        const alvos = [elemento, ...elemento.querySelectorAll('path, polygon, circle, rect, ellipse')];
                        alvos.forEach(el => {
                            el.style.fill = corPadrao;
                            el.setAttribute('fill', corPadrao);
                        });
                    }

                    // Reativa o fade só depois do repaint com o cinza
                    svg.getBoundingClientRect();
                    mapa.classList.remove('sem-transicao');
                    console.log('🔄 Mapa resetado');
                },
                pintarPais(nomePais, cor) {
                    console.log(`🎨 Tentando pintar: ${nomePais} de ${cor}`);

                    const codigoISO = this.paisesIsoMapping[nomePais];
                    console.log(`🔍 Código ISO: ${codigoISO}`);

                    if (!codigoISO) {
                        console.warn(`⚠️ País não encontrado no mapeamento: ${nomePais}`);
                        return;
                    }

                    const svg = this.$el.querySelector('svg');
                    console.log(`📊 SVG encontrado:`, svg ? 'SIM' : 'NÃO');

                    if (!svg) {
                        console.error('❌ SVG não encontrado no DOM');
                        return;
                    }

                    // Usar querySelector ao invés de getElementById
                    let elemento = svg.querySelector(`#${codigoISO}`);
                    console.log(`🗺️ Elemento ${codigoISO}:`, elemento ? 'ENCONTRADO' : 'NÃO ENCONTRADO');

                    if (elemento) {
                        // Pintar o elemento principal
                        elemento.style.fill = cor;
                        elemento.setAttribute('fill', cor);

                        // Pintar todos os paths filhos (caso seja um grupo)
                        const paths = elemento.querySelectorAll('path, polygon, circle, rect, ellipse');
                        paths.forEach(path => {
                            path.style.fill = cor;
                            path.setAttribute('fill', cor);
                        });

                        console.log(`✅ ${nomePais} (${codigoISO}) pintado de ${cor} (${paths.length} elementos)`);
                    } else {
                        console.warn(`⚠️ Elemento SVG não encontrado para: ${codigoISO}`);
                        // Listar alguns IDs disponíveis para debug
                        const ids = Array.from(svg.querySelectorAll('[id]')).map(el => el.id).slice(0, 10);
                        console.log('IDs disponíveis (primeiros 10):', ids);
                    }
                }
            }
        };

        // Componente: CompararPanel. Tela cheia com dois mapas lado a
        // lado, cada um com um seletor de regionalização (coluna) e os
        // próprios botões de executar/parar/velocidade, para o aluno
        // comparar duas regionalizações. Os blocos ficam escondidos (não
        // dá para editar aqui); "Voltar" retorna aos painéis.
        const CompararPanel = {
            name: 'CompararPanel',
            components: { MapaPanel },
            // colunas: as que têm programa montado (opções dos seletores).
            // colunaInicial: a coluna em exibição ao abrir, vai no mapa
            // da esquerda. programaDaColuna: função do App que gera o
            // programa de uma coluna (blocos + ordem da tabela dela).
            props: ['paises', 'paisesIsoMapping', 'continente', 'colunas', 'colunaInicial', 'programaDaColuna'],
            emits: ['voltar'],
            data() {
                const esquerda = this.colunas.includes(this.colunaInicial) ? this.colunaInicial : this.colunas[0];
                const direita = this.colunas.find(c => c !== esquerda) || esquerda;
                return { lados: [{ coluna: esquerda }, { coluna: direita }] };
            },
            created() {

                this.mapas = [];
            },
            template: `
                <div class="comparar-panel">
                    <div class="painel-cabecalho comparar-cabecalho">
                        <button class="btn-contorno" @click="$emit('voltar')" title="Volta aos blocos">← Voltar aos blocos</button>
                        <span class="comparar-titulo">Comparar regionalizações da <strong>{{ continente.nome }}</strong></span>
                    </div>
                    <div class="comparar-mapas">
                        <div class="comparar-lado" v-for="(lado, i) in lados" :key="i">
                            <div class="painel-cabecalho coluna-seletor">
                                <label :for="'comparar-coluna-' + i">Regionalização por:</label>
                                <select :id="'comparar-coluna-' + i" v-model="lado.coluna" @change="mapas[i].resetarMapa()">
                                    <option v-for="c in colunas" :key="c" :value="c">{{ c }}</option>
                                </select>
                            </div>
                            <mapa-panel
                                :ref="el => mapas[i] = el"
                                :paises="paises"
                                :paises-iso-mapping="paisesIsoMapping"
                                :continente="continente"
                                :obter-programa="() => programaDaColuna(lado.coluna)"
                            ></mapa-panel>
                        </div>
                    </div>
                </div>
            `
        };

        // App principal
        const app = createApp({
            components: {
                TelaInicial,
                DadosPanel,
                BlocklyPanel,
                MapaPanel,
                CompararPanel,
                SalaConfig
            },
            data() {
                // Continente da URL (?continente=id); sem ele, tela inicial
                const continente = continenteDaURL();
                const ehSala = !!continente && continente.tipo === 'sala';
                return {
                    continente,
                    // Sala de aula (null nos continentes): link da planilha,
                    // respostas lidas (sem data/nome/e-mail) e a pergunta com
                    // a posição na sala. A tabela (paises) é calculada disso:
                    // uma linha por região (veja montarRegioes)
                    sala: ehSala ? {
                        link: lerLinkSala(),
                        carregando: false,
                        erro: '',
                        tabela: null,
                        perguntas: [],
                        pergunta: null,
                        avisos: { varias: 0, semPosicao: 0 }
                    } : null,
                    // Janela de configuração da sala aberta sobre os painéis
                    configurandoSala: false,
                    paises: [],
                    paisesISOMapping: {},
                    loading: true,
                    // Coluna da tabela em exibição. Cada coluna tem o seu

                    // (na sala, definida ao ler as respostas)
                    colunaSelecionada: continente ? continente.colunaInicial || null : null,
                    // Ordenação da tabela, lembrada por coluna (faz parte da

                    // Colunas ausentes usam ORDENACAO_PADRAO.
                    ordenacoes: {},
                    // Comparação de regionalizações (CompararPanel) no

                    comparando: false,
                    colunasComparaveis: [],
                    // País que o laço do mapa principal está visitando

                    paisEmExecucao: null,
                    // País clicado na tabela: linha marcada e mapa com zoom
                    // nele (o mapa zera ao clicar nele ou resetar o zoom)
                    paisSelecionado: null,
                    panelWidths: [

                    isResizing: false,

                    startWidth: 0
                };
            },
            computed: {

                    return termosDo(this.continente);

                totalRespostas() {

                },
                // Na sala, a quantidade de alunos aparece como "Região" no
                // seletor de coluna (só o rótulo; a coluna não muda)
                rotulosColunas() {

                },
                ordenacaoAtual: {

            watch: {
                // Ao trocar a coluna, o mapa mostrava a regionalização de
                // outro workspace: volta ao cinza (e para a execução) até o

                colunaSelecionada() {

            },
            async mounted() {
                if (!this.continente) return;
                document.title = `Regionalização da ${this.continente.nome} - CLIC Geografia`;
                definirOrdemValores(this.continente.ordemValores);
                if (this.sala) {
                    await this.iniciarSala();
                } else {
                    await this.carregarDados();
                }
                this.abrirProjetoPendente();
                // Pointer Events: o divisor também se arrasta com o dedo
                document.addEventListener('pointermove', this.handleMouseMove);
                document.addEventListener('pointerup', this.stopResize);
                document.addEventListener('pointercancel', this.stopResize);
            },
            beforeUnmount() {
                document.removeEventListener('pointermove', this.handleMouseMove);
                document.removeEventListener('pointerup', this.stopResize);
                document.removeEventListener('pointercancel', this.stopResize);
            },
            methods: {
                async carregarDados() {
                    try {
                        const arquivos = arquivosDoContinente(this.continente);
                        // Adicionar timestamp para evitar cache
                        const timestamp = new Date().getTime();
                        const [resPaises, resISO] = await Promise.all([
                            fetch(`${arquivos.paises}?v=${timestamp}`),
                            fetch(`${arquivos.iso}?v=${timestamp}`)
                        ]);

                        this.paises = await resPaises.json();
                        this.paisesISOMapping = await resISO.json();

                        this.loading = false;
                        console.log('✅ Dados carregados');
                        console.log('📋 Primeiros países:', this.paises.slice(0, 3).map(p => p['País']));
                    } catch (error) {
                        console.error('❌ Erro:', error);
                        alert('Erro ao carregar dados. Veja o console.');
                    }
                },
                // Sala de aula ao abrir: dados de um projeto a abrir (deixado
                // por abrirProjeto antes de recarregar a página) ou a última
                // planilha usada neste navegador. Sem nenhum dos dois, fica
                // na tela de configuração.
                async iniciarSala() {
                    // Regiões na ordem da sala (frente para o fundo), não
                    // alfabética, na tabela e no laço
                    definirOrdemValores({ 'País': REGIOES_SALA.map(r => r.nome) });
                    let pendente = null;
                    try {
                        pendente = JSON.parse(sessionStorage.getItem(CHAVE_PROJETO_PENDENTE) || 'null');
                    } catch (error) { /* ignorado: abrirProjetoPendente descarta */ }
                    if (pendente && pendente.continente === 'sala' && pendente.sala) {
                        this.aplicarDadosSala(pendente.sala);
                        // Abre os painéis mesmo sem a pergunta de posição:
                        // os blocos do projeto esperam o Blockly existir
                        this.loading = false;
                    } else if (this.sala.link) {
                        await this.carregarPlanilha(this.sala.link);
                    }
                },
                // Lê a planilha do link (botão "Ler respostas" e reabertura)
                async carregarPlanilha(link) {
                    this.sala.carregando = true;
                    this.sala.erro = '';
                    try {
                        const texto = await baixarCsvDaPlanilha(link);
                        this.aplicarCsv(texto, link);
                        guardarLinkSala(link);
                    } catch (error) {
                        this.sala.erro = error.message;
                    } finally {
                        this.sala.carregando = false;
                    }
                },
                // Arquivo CSV enviado na configuração (sem link: não há o
                // que atualizar depois)
                carregarCsv(texto) {
                    this.sala.erro = '';
                    try {
                        this.aplicarCsv(texto, '');
                    } catch (error) {
                        this.sala.erro = error.message;
                    }
                },
                aplicarCsv(texto, link) {
                    const tabela = limparRespostas(lerCsv(texto));
                    if (!tabela.cabecalho.length) {
                        throw new Error('A planilha não tem perguntas (além de data, nome ou e-mail, que ficam de fora).');
                    }
                    if (!tabela.respostas.length) {
                        throw new Error('A planilha ainda não tem respostas.');
                    }
                    this.aplicarDadosSala({ tabela, pergunta: this.sala.pergunta, link });
                },
                // Troca as respostas da sala e a pergunta de posição (a
                // anterior, se ainda existir; senão detecta). Na primeira
                // leitura, com a posição encontrada, já abre os painéis;
                // sem ela a configuração pede a pergunta.
                aplicarDadosSala({ tabela, pergunta, link }) {
                    if (link !== undefined) this.sala.link = link;
                    this.sala.tabela = tabela;
                    this.sala.perguntas = perguntasDaTabela(tabela).map(p => p.nome);
                    this.sala.pergunta = this.sala.perguntas.includes(pergunta) ? pergunta : detectarPerguntaPosicao(tabela);
                    this.recalcularRegioes();
                    if (this.loading && this.sala.pergunta) this.loading = false;
                },
                // Tabela das seis regiões a partir das respostas. Se os
                // números mudaram (respostas novas), a pintura do mapa não
                // vale mais e ele volta ao cinza
                recalcularRegioes() {
                    const { regioes, avisos } = montarRegioes(this.sala.tabela, this.sala.pergunta);
                    const mudou = JSON.stringify(regioes) !== JSON.stringify(this.paises);
                    this.sala.avisos = avisos;
                    this.paises = regioes;
                    this.paisesISOMapping = isoDasRegioes();
                    if (!(this.colunaSelecionada in regioes[0])) this.colunaSelecionada = COLUNA_QUANTIDADE;
                    if (mudou && this.$refs.mapa) this.$refs.mapa.resetarMapa();
                },
                escolherPerguntaSala(pergunta) {
                    this.sala.pergunta = pergunta;
                    this.recalcularRegioes();
                },
                // Botão "Começar" da configuração em tela cheia
                comecarSala() {
