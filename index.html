                },
                async atualizarRespostas() {
                    await this.carregarPlanilha(this.sala.link);
                    if (this.sala.erro) alert(this.sala.erro);
                },
                // "Abra um projeto salvo" na configuração em tela cheia (ainda
                // sem blocos): os dados da sala vêm do projeto e os blocos
                // entram assim que o Blockly existir (abrirProjetoPendente)
                abrirProjetoNaConfiguracao(projeto) {
                    if (projeto && projeto.formato === PROJETO_FORMATO && projeto.continente === 'sala' && projeto.sala) {
                        sessionStorage.setItem(CHAVE_PROJETO_PENDENTE, JSON.stringify(projeto));
                        this.aplicarDadosSala(projeto.sala);
                        this.loading = false;
                        this.abrirProjetoPendente();
                    } else {
                        this.abrirProjeto(projeto);
                    }
                },
                voltarAoInicio() {
                    location.href = location.pathname;
                },
                // Há blocos montados em alguma coluna (trabalho a perder)?
                temBlocos() {
                    const blockly = this.$refs.blockly;
                    return !!blockly && Object.keys(blockly.exportarWorkspaces()).length > 0;
                },
                // Botão "Baixar projeto": salva em um .json os blocos de
                // todas as colunas, a ordenação de cada uma e a coluna em
                // exibição, para abrir depois (ou em outro computador)
                baixarProjeto() {
                    const projeto = {
                        formato: PROJETO_FORMATO,
                        versao: PROJETO_VERSAO,
                        criadoEm: new Date().toISOString(),
                        continente: this.continente.id,
                        colunaSelecionada: this.colunaSelecionada,
                        ordenacoes: this.ordenacoes,
                        workspaces: this.$refs.blockly.exportarWorkspaces()
                    };
                    // Sala de aula: as respostas vão junto (o projeto abre
                    // sem internet) e o link, para atualizar depois
                    if (this.sala) {
                        projeto.sala = {
                            link: this.sala.link,
                            pergunta: this.sala.pergunta,
                            tabela: this.sala.tabela
                        };
                    }
                    const blob = new Blob([JSON.stringify(projeto, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `regionalizacao-${this.continente.id}-${new Date().toISOString().slice(0, 10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                },
                // Botão "Abrir projeto": substitui o projeto atual pelo do
                // arquivo escolhido (já lido e parseado pelo BlocklyPanel)
                async abrirProjeto(projeto) {
                    if (!projeto || projeto.formato !== PROJETO_FORMATO) {
                        alert('Este arquivo não é um projeto da Ferramenta de Regionalização.');
                        return;
                    }
                    if (projeto.versao > PROJETO_VERSAO) {
                        alert('Este projeto foi salvo em uma versão mais nova da ferramenta e não pode ser aberto aqui.');
                        return;
                    }
                    // Projetos da versão 1 eram sempre da América
                    const idContinente = projeto.continente || 'america';
                    const outro = CONTINENTES[idContinente];
                    if (!outro || !outro.disponivel) {
                        alert(`Este projeto é de um continente que esta ferramenta ainda não tem (${idContinente}).`);
                        return;
                    }
                    // Só pergunta se há trabalho a perder
                    const temBlocos = this.temBlocos();
                    if (outro.id !== this.continente.id) {
                        const aviso = temBlocos ? ' Os blocos atuais serão perdidos.' : '';
                        if (!confirm(`Este projeto é da ${outro.nome}. Trocar para a ${outro.nome} e abrir o projeto?${aviso}`)) {
                            return;
                        }
                        // A página recarrega no outro continente e abre o
                        // projeto logo depois (veja abrirProjetoPendente)
                        sessionStorage.setItem(CHAVE_PROJETO_PENDENTE, JSON.stringify(projeto));
                        location.href = urlDoContinente(outro);
                        return;
                    }
                    if (temBlocos && !confirm('Abrir o projeto vai substituir os blocos atuais de todas as colunas. Continuar?')) {
                        return;
                    }
                    // Sala de aula: as respostas guardadas no projeto
                    // substituem as atuais (antes de filtrar as colunas)
                    if (this.sala && projeto.sala) {
                        this.aplicarDadosSala(projeto.sala);
                    }

                    // Colunas que não existem mais nos dados são ignoradas
                    const colunas = Object.keys(this.paises[0] || {});
                    const workspaces = Object.fromEntries(
                        Object.entries(projeto.workspaces || {}).filter(([c]) => colunas.includes(c))
                    );
                    this.ordenacoes = Object.fromEntries(
                        Object.entries(projeto.ordenacoes || {}).filter(([c]) => colunas.includes(c))
                    );
                    if (colunas.includes(projeto.colunaSelecionada)) {
                        this.colunaSelecionada = projeto.colunaSelecionada;
                    }
                    // Espera o BlocklyPanel reagir à troca de coluna (se
                    // houve) antes de trocar os workspaces, senão a troca
                    // gravaria os blocos antigos por cima dos importados
                    await this.$nextTick();
                    this.$refs.mapa.resetarMapa();
                    try {
                        this.$refs.blockly.importarWorkspaces(workspaces);
                    } catch (error) {
                        console.error('❌ Erro ao abrir projeto:', error);
                        alert('Não foi possível carregar os blocos deste projeto: ' + error.message);
                    }
                },
                // Projeto de outro continente deixado por abrirProjeto antes
                // de recarregar a página: abre assim que o Blockly existir
                abrirProjetoPendente() {
                    const texto = sessionStorage.getItem(CHAVE_PROJETO_PENDENTE);
                    if (!texto) return;
                    sessionStorage.removeItem(CHAVE_PROJETO_PENDENTE);
                    let projeto;
                    try {
                        projeto = JSON.parse(texto);
                    } catch (error) {
                        return;
                    }
                    if (projeto.continente !== this.continente.id) return;
                    // O BlocklyPanel só cria o workspace ~500ms depois de montar
                    const tentar = (restantes) => {
                        const blockly = this.$refs.blockly;
                        if (blockly && blockly.workspace) {
                            this.abrirProjeto(projeto);
                        } else if (restantes > 0) {
                            setTimeout(() => tentar(restantes - 1), 200);
                        }
                    };
                    tentar(25);
                },
                // Botão do continente no BlocklyPanel: volta à tela inicial
                // (recarrega a página sem ?continente). Os blocos ficam só
                // em memória, então avisa se houver trabalho a perder.
                trocarContinente() {
                    if (this.temBlocos() && !confirm('Voltar à escolha de continente descarta os blocos atuais. Baixe o projeto antes se quiser guardá-los. Continuar?')) {
                        return;
                    }
                    location.href = location.pathname;
                },
                // Clique numa linha da tabela: seleciona o país e o mapa voa
                // até ele; clicar de novo na mesma linha volta ao mapa inteiro
                selecionarPais(nome) {
                    if (nome === this.paisSelecionado) {
                        this.$refs.mapa.resetZoom();
                    } else {
                        this.paisSelecionado = nome;
                        this.$refs.mapa.focarPais(nome);
                    }
                },
                // Programa de uma coluna para um MapaPanel rodar: os blocos
                // dela (BlocklyPanel) mais os países na ordem da tabela
                // daquela coluna. null se a coluna não tem blocos.
                programaDaColuna(coluna) {
                    const blockly = this.$refs.blockly;
                    const programa = blockly ? blockly.programaDaColuna(coluna) : null;
                    if (!programa) return null;
                    const ordenacao = this.ordenacoes[coluna] || ORDENACAO_PADRAO;
                    return { ...programa, paises: ordenarPaises(this.paises, coluna, ordenacao) };
                },
                // Botão "Comparar" do mapa: abre os dois mapas lado a lado.
                // Só entram no seletor as colunas com programa montado, na
                // ordem das colunas da tabela
                abrirComparacao() {
                    const comBlocos = Object.keys(this.$refs.blockly.exportarWorkspaces());
                    const colunas = Object.keys(this.paises[0] || {}).filter(c => comBlocos.includes(c));
                    if (colunas.length < 2) {
                        alert('Para comparar, monte a regionalização de pelo menos duas colunas.');
                        return;
                    }
                    this.colunasComparaveis = colunas;
                    this.comparando = true;
                },
                fecharComparacao() {
                    this.comparando = false;
                    // O workspace ficou escondido (display: none) e precisa
                    // se remedir ao reaparecer
                    if (window.resizeBlockly) {
                        this.$nextTick(() => window.resizeBlockly());
                    }
                },
                // Painel de dados sempre do tamanho da tabela (coluna atual)
                ajustarPainelDados(largura) {
                    this.panelWidths[0] = Math.max(200, largura);
                    if (window.resizeBlockly) {
                        this.$nextTick(() => window.resizeBlockly());
                    }
                },
                startResize(panelIndex, event) {
                    this.isResizing = true;
                    this.currentResizer = panelIndex;
                    this.startX = event.clientX;
                    this.startWidth = this.panelWidths[panelIndex];
                    event.preventDefault();
                },
                handleMouseMove(event) {
                    if (!this.isResizing) return;

                    const delta = event.clientX - this.startX;
                    const newWidth = this.startWidth + delta;

                    // Largura mínima de 200px
                    if (newWidth >= 200) {
                        this.panelWidths[this.currentResizer] = newWidth;

                        // Se estiver redimensionando o painel do Blockly, atualizar workspace
                        if (this.currentResizer === 1 && window.resizeBlockly) {
                            window.resizeBlockly();
                        }
                    }
                },
                stopResize() {
                    if (this.isResizing) {
                        this.isResizing = false;
                        this.currentResizer = null;

                        // Atualizar workspace do Blockly após redimensionamento
                        if (window.resizeBlockly) {
                            setTimeout(() => {
                                window.resizeBlockly();
                            }, 50);
                        }
                    }
                }
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
